<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C単語ドリル">
<meta name="theme-color" content="#FFFFFF">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>C単語ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-column phone app — highlighter-marked word cards on cool paper, bottom tab bar */
/* White background by request: single light theme on purpose */
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#22254D; --muted:#646891; --line:#E3E5F0; --soft:#F2F3F9;
  --hl:#FFE14F; --hl-ink:#22254D; --tint:#EEF0FF; --white:#FFFFFF;
  --primary:#2F35A6; --on-primary:#FFFFFF;
  --ok:#137A51; --ok-bg:#DCF2E6; --ng:#C23733; --ng-bg:#FBE2E1;
  --bronze:#B9773E; --silver:#8E98AB; --gold:#D29C0C; --plat:#2F9BC0; --locked:#E7E9F2;
  --f-word:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}

body{background:var(--paper);color:var(--ink);font-family:var(--f-ja);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.app{max-width:560px;margin:0 auto;padding-block:18px 110px;display:flex;flex-direction:column;gap:20px}
h1,h2,p{margin:0}
h1{font-size:24px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
h2{font-size:15px;font-weight:700}
.eyebrow,.label,.kicker{font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.note{font-size:12.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
section{display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.streak{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.streak b{font-family:var(--f-word);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}

button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn{border:1.5px solid var(--primary);background:transparent;color:var(--primary);border-radius:999px;padding:10px 18px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%;padding:14px}
.ghost{border:0;background:none;color:var(--muted);font-weight:700;padding:6px 0}
.danger{border-color:var(--ng);color:var(--ng)}

.hero{padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero-row.sub{border-top:1px dashed var(--line);padding-top:14px}
.big{font-family:var(--f-word);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-family:var(--f-word);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.big small,.mid small{font-family:var(--f-ja);font-size:14px;margin-left:3px;color:var(--muted)}

.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.fc div{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.fc .n{font-family:var(--f-word);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.fc .b{width:100%;max-width:30px;background:var(--hl);border-radius:6px 6px 2px 2px;min-height:3px}
.fc .b.zero{background:var(--soft)}
.fc .d{font-size:10.5px;color:var(--muted);white-space:nowrap}

.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.set{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:center;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.set-name{font-family:var(--f-word);font-weight:800;font-size:18px;grid-row:span 2}
.set-num{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}

mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 .08em}
.qhead{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);transition:width .25s}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.qcard{padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.word{font-family:var(--f-word);font-size:clamp(32px,10vw,44px);font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.ja{font-size:19px;font-weight:700}
.ex{font-family:var(--f-word);font-weight:600;font-size:16px;line-height:1.55;color:var(--ink);max-width:36ch}
.ex.cz{font-size:18px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--primary);margin:0 .15em}
.hint{font-size:13px;color:var(--muted)}
.say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.say svg{width:16px;height:16px}
.play{width:88px;height:88px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.play svg{width:38px;height:38px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;min-height:52px}
.olet{opacity:.6;margin-right:.45em;font-weight:600}
.gknow{margin-top:10px;font-size:14px}.gknow.on{opacity:.75}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-size:inherit}
.opt.en{font-family:var(--f-word);font-weight:600;font-size:18px}
.opt.is-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.is-ng{border-color:var(--ng);background:var(--ng-bg);color:var(--ng)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.spell{width:100%;font-family:var(--f-word);font-size:24px;font-weight:600;text-align:center;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.ng{background:var(--ng-bg);border-color:var(--ng)}
.verdict{font-weight:900;font-size:17px}
.fb.ok .verdict{color:var(--ok)} .fb.ng .verdict{color:var(--ng)}
.ipa{font-family:"Lucida Sans Unicode","Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;color:var(--muted);font-size:16px;margin:2px 0 4px;letter-spacing:.02em}
.fb .ipa{margin-top:-2px}
.fb-word{font-family:var(--f-word);font-weight:800;font-size:22px}
.fb-word span{font-family:var(--f-ja);font-size:15px;font-weight:700;margin-left:8px}
.fb .ex{max-width:none;font-size:15px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.sum{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.miss{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.miss li{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.miss b{font-family:var(--f-word);font-size:17px}

.photo-btns{display:flex;flex-direction:column;gap:10px}
.ai{padding:16px;display:flex;flex-direction:column;gap:10px}
.ai h2{margin:0}.ai .tag{font-size:11px;background:var(--primary);color:var(--on-primary);border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:4px}
.ai details textarea{margin-top:6px}.ai details .btn{margin-top:8px}
.sub-h{font-size:15px;margin:8px 0 0}
.pv-big{padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}.pv-big p{margin:0}
.pv-set{font-size:13px;padding:6px 10px}
.pv-meta{font-size:12px;color:var(--muted);line-height:1.4}
.para{font-size:14px;color:var(--muted);margin:2px 0 0}.fb .para{text-align:left}
.para-def{font-size:18px;font-weight:700;line-height:1.5}
.para-q{font-size:clamp(22px,7vw,30px)}
.exja{font-size:12.5px;color:var(--muted);margin:2px 0 0;text-align:left}
.synant{font-size:13px;margin:6px 0 0;text-align:left}.synant span{font-weight:800;color:var(--primary);margin-right:4px}
.rel{font-size:13px;margin:8px 0 0;text-align:left;line-height:1.6}.rel span{display:inline-block;font-size:11px;font-weight:700;color:var(--on-primary);background:var(--primary);border-radius:999px;padding:1px 8px;margin-right:6px}.rel b{font-family:var(--f-word)}
.tip{font-size:13px;color:var(--muted);margin:6px 0 0;text-align:left}
.photo{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-sizing:border-box;white-space:normal;text-align:center}
.photo svg{width:20px;height:20px;flex:none}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo.off{opacity:.45;pointer-events:none}
.ocr-st{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;margin:0}
.ocr-st.err{background:var(--ng-bg);color:var(--ng);border-color:transparent}
.spin{width:14px;height:14px;border:2.5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.steps-ol{margin:4px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps-ol .note{display:block}
.steps{padding:14px 16px}
.steps ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.steps .note{display:block}
textarea,input[type=text],input[type=search],select{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.pv{display:flex;flex-direction:column;gap:8px}
.pv-row{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:10px;align-items:start}
.pv-row .inputs{display:flex;flex-direction:column;gap:6px;min-width:0}
.pv-row input[type=text]{padding:7px 10px;font-size:14px}
.pv-row .w{font-family:var(--f-word);font-weight:600}
.pv-row input[type=checkbox]{width:20px;height:20px;margin-top:8px;accent-color:var(--primary)}
.dup{font-size:11.5px;color:var(--muted)}
.manual{padding:12px 16px}
.manual summary{font-weight:700;cursor:pointer}
.manual .field{margin-top:10px}
.manual .btn{margin-top:10px}

.filters{display:grid;grid-template-columns:1fr 110px;gap:8px}
.wrow{border-bottom:1px solid var(--line)}
.wrow-main{width:100%;display:grid;grid-template-columns:minmax(0,auto) 1fr auto;gap:10px;align-items:baseline;background:none;border:0;text-align:left;padding:11px 2px}
.ww{font-family:var(--f-word);font-weight:600;font-size:17px}
.wj{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.s1,.chip.s2{background:var(--ng-bg);color:var(--ng)}
.chip.s3,.chip.s4{background:var(--hl);color:var(--hl-ink)}
.chip.s5,.chip.s6{background:var(--ok-bg);color:var(--ok)}
.wdet{padding:0 2px 14px;display:flex;flex-direction:column;gap:8px}
.wdet .ex{font-size:14.5px;max-width:none}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:30px 0}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.flow-g{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}.flow-g .label{margin:0}
.flowleft{font-size:12px;font-weight:800;color:var(--primary);white-space:nowrap}
.lesson{padding:20px 18px;display:flex;flex-direction:column;gap:10px}.lesson h1{font-size:22px;margin:0}
.lbody{display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.8}.lbody p,.lbody ul,.lbody h3{margin:0}.lbody h3{font-size:17px;border-left:4px solid var(--primary);padding-left:8px}
.points{background:var(--ok-bg);border-radius:12px;padding:12px 14px}.points h3{margin:0 0 6px;font-size:15px;color:var(--ok)}.points ul{margin:0;padding-left:1.2em;line-height:1.7}
.kw{border:0;background:none;padding:0;font:inherit;color:var(--primary);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px}
.kwpop{position:fixed;left:12px;right:12px;bottom:84px;z-index:40;background:var(--card);border:1.5px solid var(--primary);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px}
.kwpop[hidden]{display:none}
.urel{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px;font-size:14px}.urel p{margin:0}
.grow{flex:1}
.ok-t{color:var(--ok)}.ng-t{color:var(--ng)}
.plan .bar,.panel .bar{display:block}
#c-book{margin:4px 0 0}#c-deadline{width:auto;flex:1}
.units{display:flex;flex-direction:column;gap:8px}
.unit{background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.unit.is-weak{border-color:var(--ng)}.unit.is-done{border-color:var(--ok)}
.unit-h{width:100%;background:none;border:0;display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:12px 14px;text-align:left;align-items:center}
.unit-name{font-weight:800}.unit-h .bar{grid-column:1/2}.unit-num{font-size:12px;color:var(--muted);font-weight:700}
.unit-d{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.st-完了{background:var(--ok-bg);color:var(--ok)}.st-苦手{background:var(--ng-bg);color:var(--ng)}.st-学習中{background:var(--locked);color:var(--ink)}.st-未着手{background:var(--locked);color:var(--muted)}
.weak .wk{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.weak .wk:last-child{border:0}
.score{font-family:var(--f-word);font-size:56px;font-weight:800;margin:0;line-height:1}.score small{font-size:18px}
.gram details{margin-top:4px}.gram .sets{margin-top:8px}
.gq-text{font-size:18px;font-weight:700;line-height:1.7;text-align:left;width:100%;margin:0}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--ink);margin:0 2px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;align-items:center}
.tiles.built{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:10px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-family:var(--f-word);font-weight:600;font-size:16px}
.tiles.built .tile{border-color:var(--primary);color:var(--primary)}
.fb-ans{margin:0}.gexp{margin:0;font-size:14px;line-height:1.6}
.share-list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.sbook{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.sbook-h{font-weight:800;display:flex;align-items:center;gap:6px}
.sbook details{margin-top:6px}.sbook-sets{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:260px;overflow:auto}
.mix{margin:2px 0 0;font-size:11.5px}
.grade-q{margin:4px 0 0;text-align:center;font-weight:700;font-size:14px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grades.two{grid-template-columns:repeat(2,1fr)}
.grade{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;white-space:normal;line-height:1.2}
.grade{font-size:13px}.grade b{font-size:19px}.grade small{font-size:9.5px;font-weight:700;opacity:.8}
.g-perfect{border-color:var(--ok,#1a7f4b);color:var(--ok,#1a7f4b)}
.g-unsure{border-color:#c77c02;color:#c77c02}.g-unsure.primary{background:#c77c02;color:#fff}
.g-bad{border-color:var(--ng);color:var(--ng)}
.known-btn{margin-top:8px}
.time-rec{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.time-rec .label{margin:0}.time-rec .mid{margin:0}.time-rec .mid small{font-size:13px}
.bests{padding:6px 16px}
.best-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.best-row:last-child{border-bottom:0}
.best-row span{font-weight:700;font-size:14px}.best-row b{font-family:var(--f-word);font-variant-numeric:tabular-nums}
.best-row b small,.best-row>small{color:var(--muted);font-size:11.5px;font-weight:700}
.soon-wait{margin:0;text-align:right;font-weight:700;color:var(--primary);line-height:1.3}
.soon-wait small{color:var(--muted);font-weight:700}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-variant-numeric:tabular-nums}
.seg button.on{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.checks{display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.checks input{width:20px;height:20px;accent-color:var(--primary)}
.panel{padding:16px;display:flex;flex-direction:column;gap:10px}
.warn{background:var(--ng-bg);color:var(--ng);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--primary)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100% - 48px);text-align:center}
.streak .star{color:var(--gold);font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:11.5px;color:var(--muted);font-weight:700}
.stat b{font-family:var(--f-word);font-size:22px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat b small{font-family:var(--f-ja);font-size:11.5px;color:var(--muted);margin:0 2px}
.rank{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--tint);border-radius:var(--r)}
.rank-badge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:var(--white);font-family:var(--f-word);font-weight:800;font-size:14px;box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--rc)}
.rank-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rank-title{font-weight:900;font-size:17px;line-height:1.3}
.rank-next{font-size:12px;color:var(--muted)}
.rank .bar{background:var(--white)}
.mrow{display:flex;flex-direction:column;gap:6px}
.mlabel{font-size:12px;color:var(--muted);font-weight:700}
.medals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 6px}
.medal{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.medal i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-word);font-weight:800;font-size:15px;background:var(--mc);color:var(--white);box-shadow:inset 0 0 0 3px rgba(255,255,255,.4),0 0 0 2px var(--mc)}
.medal.off i{background:var(--locked);color:var(--muted);box-shadow:none}
.medal span{font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.3}
.medal.off span{opacity:.7}
.tier{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tier-stars{font-size:34px;letter-spacing:4px;color:var(--gold);line-height:1}
.tier-stars .off{color:var(--locked)}
.tier-msg{font-size:22px;font-weight:900;text-wrap:balance;line-height:1.4}
.tier.t4 .tier-msg{color:var(--primary)}
.tier-sub{color:var(--muted);font-size:14px}
.rankup{background:var(--hl);color:var(--hl-ink);border-radius:10px;padding:10px 12px;font-weight:900;text-align:center}
.newmedals{background:var(--tint);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.combo{display:inline-block;margin-left:8px;background:var(--hl);color:var(--hl-ink);font-weight:900;border-radius:999px;padding:2px 12px;font-size:13px;vertical-align:middle}
.pop{animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}

const MORE={streak:{list:[150,200,300,365,500,730,1000],step:500},correct:{list:[5000,10000,20000,30000,50000],step:25000},

const PFX={streak:"s",correct:"c",time:"t",perfect:"p",words:"w",mastered:"m"};
const kfmt=n=>n>=1000?(n%1000?(n/1000).toFixed(1):n/1000)+"K":String(n);
function mkMedal(cat,n,i){
  const h=Math.round(n/60);
  const inner=cat==="time"?h+"h":cat==="correct"||cat==="words"||cat==="mastered"?kfmt(n):String(n);
  const label=cat==="streak"?n+"日連続":cat==="correct"?"正解"+n+"語":cat==="time"?h+"時間":cat==="perfect"?"満点"+n+"回":cat==="mastered"?"定着"+n+"語":n+"語";
  return{id:PFX[cat]+n,cat,n,t:["g","p","m"][i%3],inner,label};
}
function medalsFor(cat,upTo){ // 取れたメダルぜんぶ＋次の1個
  const out=MEDALS.filter(m=>m.cat===cat);if(out.length&&out[out.length-1].n>upTo)return out;
  const mo=MORE[cat],nth=i=>i<mo.list.length?mo.list[i]:mo.list[mo.list.length-1]+mo.step*(i-mo.list.length+1);
  for(let i=0;;i++){const m=mkMedal(cat,nth(i),i);out.push(m);if(m.n>upTo)return out;}
}
function medalValues(){return{streak:Math.max(streak(),S.stats.bestStreak||0),correct:S.stats.correct,time:Math.floor(S.stats.timeMs/60000),perfect:S.stats.perfect,words:S.words.filter(w=>w.stage>0).length,mastered:S.words.filter(w=>w.stage>=6).length};}
function checkMedals(){
  const v=medalValues();S.stats.bestStreak=v.streak;
  const got=Object.keys(CATS).flatMap(c=>medalsFor(c,v[c])).filter(m=>!S.stats.medals[m.id]&&v[m.cat]>=m.n).map(m=>{S.stats.medals[m.id]=today();return m;});

  return got;
}

const BOOK_CATS={pct:"達成率",units:"完了したUnit",read:"読んだ解説",perfect:"満点テスト"};
function bookMedals(book){
  const units=courseUnits(book);if(units.length<2)return null;
  const items=units.flatMap(u=>[...u.words,...u.gram]),total=items.length;if(!total)return null;
  const learned=items.filter(x=>x.stage>0).length,lessons=units.flatMap(u=>u.lessons||[]);
  const tests=units.map(u=>(S.tests||{})[testKey(book,u.unit)]||[]);
  const v={pct:Math.floor(learned/total*100),units:tests.filter(t=>t.some(x=>x.s>=80)).length,read:lessons.filter(l=>l.read).length,perfect:tests.filter(t=>t.some(x=>x.s>=100)).length};
  const steps=(arr,max)=>[...new Set(arr.filter(n=>n<max).concat(max>0?[max]:[]))];
  const defs={pct:[10,25,50,75,90,100],units:steps([1,3,5,10,20,30,50,75,100],units.length),read:lessons.length?steps([1,5,10,25,50,100],lessons.length):[],perfect:steps([1,3,5,10,20,30,50],units.length)};
  const list=[];Object.entries(defs).forEach(([cat,ns])=>ns.forEach((n,i)=>{const all=(cat==="units"||cat==="perfect")&&n===units.length||cat==="read"&&n===lessons.length;
    list.push({id:`bk:${book}:${cat}:${n}`,cat,n,book,t:["b","s","g","p","m"][Math.min(4,Math.floor(i*5/ns.length))],
      inner:cat==="pct"?n+"%":String(n),label:cat==="pct"?`達成率${n}%`:cat==="units"?(all?"全Unit完了":`${n}Unit完了`):cat==="read"?(all?"解説ぜんぶ":`解説${n}`):(all?"全Unit満点":`満点${n}回`)});}));
  return{v,list,total,learned};
}
function bookMedalsHTML(book){
  const bm=bookMedals(book);if(!bm)return"";const got=bm.list.filter(m=>S.stats.medals[m.id]).length;
  return`<section><h2>メダル <span class="note">${got}/${bm.list.length}・達成率 ${bm.v.pct}%</span></h2>${Object.entries(BOOK_CATS).map(([cat,c])=>{const ms=bm.list.filter(m=>m.cat===cat);if(!ms.length)return"";
    let end=ms.findIndex(m=>!S.stats.medals[m.id]);if(end<0)end=ms.length-1;const to=Math.max(5,end+1),show=ms.slice(Math.max(0,to-5),to);
    return`<div class="mrow"><p class="mlabel">${c}<span class="note">　${cat==="pct"?bm.v.pct+"%":bm.v[cat]}</span></p><div class="medals">${show.map(m=>medalHTML(m)).join("")}</div></div>`;}).join("")}</section>`;
}
function tick(){if(!Q)return;const now=Date.now(),dt=Math.min(Math.max(0,now-(Q.lastT||now)),90000);S.stats.timeMs+=dt;Q.act=(Q.act||0)+dt;Q.lastT=now;
  if(dt){const d=S.days[today()]||(S.days[today()]={n:0,c:0});d.t=(d.t||0)+dt;}}
function fmtTime(ms){const m=Math.floor(ms/60000);return m<60?`${m}<small>分</small>`:`${Math.floor(m/60)}<small>時間</small>${m%60?`${m%60}<small>分</small>`:""}`;}
function medalHTML(m,pop){const on=!!S.stats.medals[m.id];return`<div class="medal ${on?"":"off"} ${pop?"pop":""}"><i style="--mc:var(--${TC[m.t]})">${m.inner}</i><span>${m.label}</span></div>`;}
function medalsHTML(){
  const v=medalValues();
  return Object.entries(CATS).map(([k,c])=>{
    const all=medalsFor(k,v[k]);let end=all.findIndex(m=>!S.stats.medals[m.id]);if(end<0)end=all.length-1;
    const to=Math.max(5,end+1),show=all.slice(Math.max(0,to-5),to),got=all.filter(m=>S.stats.medals[m.id]).length;
    return`<div class="mrow"><p class="mlabel">${c}<span class="note">　${got}個</span></p><div class="medals">${show.map(m=>medalHTML(m)).join("")}</div></div>`;}).join("");
}
function rankHTML(){
  const s=S.stats.stars,r=rankOf(s),cur=RANKS[r],nx=RANKS[r+1];

}

// 単語帳＝セット名の最初の言葉（C1〜C9 はまとめて「C単語」）
const bookOf=set=>{const t=String(set||"").trim().split(/\s+/)[0];return /^[A-Z]\d+$/.test(t)?"C単語":t||"追加";};
const newList=()=>{const off=S.settings.newOff||{};return S.words.filter(w=>w.stage===0&&!off[bookOf(w.set)]);};
// 新しく覚える単語を、単語帳ごとの「まだ覚えていない語数」の割合で割り振る（各単語帳の中は本の順番）
function pickNew(n){
  // テキストの計画があるときは、そのテキストの次のUnitから、間に合うペースの語数を先に出す
  const pi=S.plan&&S.plan.book?planInfo():null;
  if(pi&&!(S.settings.newOff||{})[pi.p.book]){
    const mine=pi.st.flatMap(x=>x.u.words.filter(w=>!w.stage)),k=Math.min(n,mine.length,Math.max(1,pi.wordsPerDay));
    const first=mine.slice(0,k),rest=k<n?pickNewMix(n-k,pi.p.book):[];
    const out=[];first.forEach((w,i)=>out.push({w,pos:(i+.5)/first.length}));rest.forEach((w,i)=>out.push({w,pos:(i+.5)/rest.length}));
    return out.sort((a,b)=>a.pos-b.pos).map(o=>o.w);
  }
  return pickNewMix(n,null);
}
function pickNewMix(n,skipBook){
  const all=newList().filter(w=>bookOf(w.set)!==skipBook),by=new Map();all.forEach(w=>{const b=bookOf(w.set);if(!by.has(b))by.set(b,[]);by.get(b).push(w);});
  n=Math.min(n,all.length);if(!n)return[];
  const al=[...by.entries()].map(([b,ws])=>{const q=n*ws.length/all.length;return{b,ws,k:Math.floor(q),r:q-Math.floor(q)};});
  if(n>=al.length)al.forEach(x=>{if(!x.k){x.k=1;x.r=-1;}}); // 語数が足りるときは、どの単語帳からも1語は出す
  let rest=n-al.reduce((a,x)=>a+x.k,0);
  while(rest<0){const x=al.filter(x=>x.k>1).sort((a,b)=>a.r-b.r)[0];if(!x)break;x.k--;rest++;}
  al.slice().sort((a,b)=>b.r-a.r).forEach(x=>{if(rest>0&&x.k<x.ws.length){x.k++;rest--;}});
  const out=[];al.forEach(x=>x.ws.slice(0,x.k).forEach((w,i)=>out.push({w,pos:(i+.5)/x.k})));
  return out.sort((a,b)=>a.pos-b.pos).map(o=>o.w); // 単語帳がまざるように並べる
}

  return c.size>1?`<p class="note mix">${[...c.entries()].map(([b,k])=>`${esc(b)} ${k}`).join("・")}</p>`:"";}

// 読み上げ用：sb→somebody、sth→something（表示はそのまま）
function sayText(t){return String(t)
  .replace(/\bsth\/sb\b/gi,"something or somebody").replace(/\bsb\/sth\b/gi,"somebody or something")
  .replace(/\bsb's\b/gi,"somebody's").replace(/\bsth's\b/gi,"something's")
  .replace(/\bsb\b/gi,"somebody").replace(/\bsth\b/gi,"something")
  .replace(/\(that\)/gi,"that").replace(/[()]/g," ").replace(/\s*\/\s*/g," or ").replace(/\s+/g," ").trim();}
function speak(t){if(!hasSpeech||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(sayText(t));u.lang="en-US";u.rate=.9;const v=speechSynthesis.getVoices().find(v=>/^en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
if(hasSpeech){try{speechSynthesis.getVoices();}catch(e){}}

function cloze(w){
  if(!w.ex||/\s/.test(w.w))return null;
  const stem=w.w.length>4?w.w.slice(0,-1):w.w;
  const re=new RegExp("(^|[^A-Za-z])("+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[A-Za-z]*)","i");
  const m=re.exec(w.ex);if(!m)return null;
  const s=m.index+m[1].length;
  return{before:w.ex.slice(0,s),hit:m[2],after:w.ex.slice(s+m[2].length)};
}
// 発音記号（CMU発音辞書をもとにしたアメリカ式）。ipa.json は後から読みこむ
let IPA=null;
function ipaOf(w){
  if(w.ipa)return w.ipa;if(!IPA)return"";
  const base=String(w.w).split(" / ")[0].replace(/\([^)]*\)/g," ").replace(/\b(A|B)\b/g," ").replace(/\b(sb|sth)\b/g,m=>m==="sb"?"somebody":"something"); // 熟語は前半の形で、A・(from A)などは読まない
  const ps=base.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z' \-]/g,"").split(/[\s\-]+/).filter(Boolean);
  const r=ps.map(x=>IPA[x]||IPA[x.replace(/'s$/,"")]||"");
  return r.length&&r.every(Boolean)?r.join(" "):"";
}
const ipaHTML=w=>{const p=ipaOf(w);return p?`<p class="ipa">/${esc(p)}/</p>`:"";};
function hlEx(w){const c=cloze(w);return c?esc(c.before)+"<mark>"+esc(c.hit)+"</mark>"+esc(c.after):esc(w.ex);}

/* ---------- 文法クイズ ---------- */
// S.grammar: [{id,set,type:"mc"|"input"|"order",q,choices,answer,exp,src,stage,due,ok,ng}]
// mc=4択（answerは正解の番号）、input=書いて答える（answerは正解の文字。いくつか正解があれば配列）、order=並べかえ（answerは正しい文）
let G=null;
const gAll=()=>S.grammar||[];
const gDue=()=>gAll().filter(g=>!g.known&&g.stage>0&&g.due&&g.due<=today());
// 分かっている問題：「もう出さない」にした問題と、正解して次の復習日がまだ先の問題。練習では出さない
const gKnown=g=>!!g.known||(g.stage>0&&!!g.due&&g.due>today());
const gPractice=list=>{const l=list.filter(g=>!gKnown(g));return[...shuffle(l.filter(g=>g.stage>0)),...l.filter(g=>!g.stage)];}; // 復習の日が来た問題 → まだやっていない問題
const gNew=()=>gAll().filter(g=>!g.stage);
function gSets(){const m=new Map();gAll().forEach(g=>{if(!m.has(g.set))m.set(g.set,[]);m.get(g.set).push(g);});return[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],"ja",{numeric:true}));}
const gNorm=s=>String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"“”。、！？]/g," ").replace(/\s+/g," ").trim();
const gAns=g=>g.type==="mc"?String((g.choices||[])[g.answer]||""):Array.isArray(g.answer)?String(g.answer[0]||""):String(g.answer||"");
const gFmt=q=>esc(q).replace(/_{2,}|（\s*）|\(\s{0,3}\)/g,'<span class="blank">　　　</span>').replace(/\n/g,"<br>");
function mergeGrammar(list,top){
  S.grammar=gAll();const idx=new Map(S.grammar.map(g=>[g.set+"|"+gNorm(g.q),g]));let add=0,upd=0;
  list.forEach(x=>{const set=x.set?(top?top+" "+x.set:x.set):(top||"文法");const k=set+"|"+gNorm(x.q);const o=idx.get(k);
    if(o){Object.assign(o,{type:x.type,choices:x.choices,answer:x.answer,exp:x.exp,src:x.src});upd++;}
    else{const g={id:uid(),set,type:x.type,q:x.q,choices:x.choices,answer:x.answer,exp:x.exp,src:x.src,stage:0,due:null,ok:0,ng:0};S.grammar.push(g);idx.set(k,g);add++;}});
  save();return{add,upd};
}
function gHomeHTML(){

}
function gStart(mode,set,given){
  let list=given?given:mode==="review"?shuffle(gDue()):mode==="new"?gNew().slice(0,10):mode==="unit"?gAll().filter(g=>bookOf(g.set)===courseBook&&unitOf(g.set)===set):gAll().filter(g=>g.set===set);
  if(!given&&(mode==="unit"||mode==="set")){const all=list;list=gPractice(all);
    if(!list.length){if(!all.length)return;const nx=all.filter(g=>!g.known&&g.due).map(g=>g.due).sort()[0];
      if(!confirm(`今やる問題はありません（分かっている問題と、復習の日を待っている問題だけです）。${nx?`次の復習は ${md(nx)} です。`:""}\nそれでもぜんぶ解きますか？`))return;list=shuffle(all.slice());}}
  if(!list.length)return;
  G={mode,set:mode==="set"||mode==="unit"?set:"",items:list.map(g=>g.id),i:0,res:{},done:false,lastT:Date.now()};gPrep();render();window.scrollTo(0,0);
}
function gPrep(){
  const id=G.items[G.i];if(!id){gFinish();return;}
  const g=(G.pool&&G.pool.get(id))||gAll().find(x=>x.id===id);if(!g){G.i++;return gPrep();}
  G.cur=g;G.answered=false;G.ok=false;G.pick=null;G.typed="";
  if(g.type==="mc"){const ix=(g.choices||[]).map((c,k)=>k);G.fixed=/[（(]\s*[a-d]\s*[)）]/.test(g.exp||"");G.order=G.fixed?ix:shuffle(ix);} // 解説が (a)(b)… で書いてあれば本の順のまま
  if(g.type==="order"){G.tiles=shuffle(gAns(g).split(/\s+/).filter(Boolean).map(t=>({t})));G.built=[];}
}
function gTick(){if(!G)return;const now=Date.now(),dt=Math.min(Math.max(0,now-(G.lastT||now)),90000);G.lastT=now;S.stats.timeMs+=dt;
  const d=S.days[today()]||(S.days[today()]={n:0,c:0});d.t=(d.t||0)+dt;}
function gSettle(ok){
  G.answered=true;G.ok=ok;gTick();const g=G.cur,t=today();
  const r=G.res[g.id]||(G.res[g.id]={wrong:false});
  const d=S.days[t]||(S.days[t]={n:0,c:0});d.n++;if(ok){d.c++;S.stats.correct++;}
  if(g.wid){ // 理解度テストの単語問題：まちがえたら、その単語を翌日の復習へ
    if(!r.applied){r.applied=true;const w=byId(g.wid);if(w){if(ok)w.ok=(w.ok||0)+1;else{w.ng=(w.ng||0)+1;if(w.stage>0){w.stage=1;w.due=addDays(t,1);}}}}

// 単語帳＝bookOf(セット名)。Unit＝セット名から「Unit117」「第2章」「Day 3」などを取り出したもの（なければセット名の残り）
const UNIT_RE=/(unit|lesson|chapter|day|stage|part|level|week)\s*(\d+)|第\s*(\d+)\s*([章課回])/i;
function unitOf(set){const book=bookOf(set);let rest=String(set||"").slice(book.length).trim();
  const m=rest.match(UNIT_RE);if(m)return m[3]?`第${m[3]}${m[4]}`:m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+m[2];
  return rest.split(/\s+/)[0]||"そのほか";}
const unitNum=u=>{const m=String(u).match(/\d+/);return m?Number(m[0]):1e9;};
function courseBooks(){const m=new Map();S.words.forEach(w=>{const b=bookOf(w.set);m.set(b,(m.get(b)||0)+1);});gAll().forEach(g=>{const b=bookOf(g.set);m.set(b,(m.get(b)||0)+1);});lAll().forEach(l=>{const b=bookOf(l.set);m.set(b,(m.get(b)||0)+1);});
  return[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([b])=>b);}
function courseUnits(book){
  const m=new Map(),get=u=>{if(!m.has(u))m.set(u,{unit:u,words:[],gram:[],lessons:[]});return m.get(u);};
  lAll().forEach(l=>{if(bookOf(l.set)===book)get(unitOf(l.set)).lessons.push(l);});
  S.words.forEach(w=>{if(bookOf(w.set)===book)get(unitOf(w.set)).words.push(w);});
  gAll().forEach(g=>{if(bookOf(g.set)===book)get(unitOf(g.set)).gram.push(g);});
  return[...m.values()].sort((a,b)=>unitNum(a.unit)-unitNum(b.unit)||a.unit.localeCompare(b.unit,"ja",{numeric:true}));
}
const testKey=(book,unit)=>book+"|"+unit;
function unitStats(book,u){
  const items=[...u.words,...u.gram],n=items.length;
  const learned=u.words.filter(w=>w.stage>0).length+u.gram.filter(g=>g.stage>0).length;
  const ok=items.reduce((a,x)=>a+(x.ok||0),0),ng=items.reduce((a,x)=>a+(x.ng||0),0);
  const acc=ok+ng?Math.round(ok/(ok+ng)*100):null;
  const tests=(S.tests||{})[testKey(book,u.unit)]||[];const last=tests[tests.length-1],best=tests.reduce((a,t)=>Math.max(a,t.s),0);
  const done=best>=80;
  const weak=(last&&last.s<70)||(acc!==null&&ok+ng>=5&&acc<70);
  const read=(u.lessons||[]).filter(l=>l.read).length;
  const status=done&&!weak?"完了":weak?"苦手":learned||read?"学習中":"未着手";
  return{read,n,learned,pct:n?Math.round(learned/n*100):0,acc,last,best,done,weak,status,tests};
}
function planInfo(){
  const p=S.plan;if(!p||!p.book||!p.deadline)return null;
  let units=courseUnits(p.book);
  if(p.from&&p.to){const a=units.findIndex(u=>u.unit===p.from),b=units.findIndex(u=>u.unit===p.to);if(a>=0&&b>=0)units=units.slice(Math.min(a,b),Math.max(a,b)+1);}
  if(!units.length)return null;
  const st=units.map(u=>({u,s:unitStats(p.book,u)}));
  const total=units.length,done=st.filter(x=>x.s.done).length,left=total-done;
  const t=today(),daysLeft=Math.max(1,Math.round((new Date(p.deadline)-new Date(t))/864e5)+1);
  const span=Math.max(1,Math.round((new Date(p.deadline)-new Date(p.start||t))/864e5)+1),gone=Math.min(span,Math.max(0,Math.round((new Date(t)-new Date(p.start||t))/864e5)));
  const expected=Math.round(total*gone/span),diff=done-expected;
  const perDay=left/daysLeft,perWeek=Math.ceil(perDay*7);
  const next=st.filter(x=>!x.s.done).slice(0,Math.max(1,Math.ceil(perDay)));
  const wordsLeft=st.reduce((a,x)=>a+x.u.words.filter(w=>!w.stage).length,0);
  return{p,st,total,done,left,daysLeft,perDay,perWeek,expected,diff,next,wordsLeft,wordsPerDay:Math.ceil(wordsLeft/daysLeft)};
}

const lAll=()=>S.lessons||[];
function mergeLessons(list,top){

  list.forEach((x,k)=>{const set=x.set?(top?top+" "+x.set:x.set):(top||"解説");const key=set+"|"+x.title;const o=idx.get(key);
    if(o){Object.assign(o,{body:x.body,points:x.points,order:x.order||k});upd++;}

let L=null,kwMap=null,kwKey="";
function kwIndex(){ // 解説の中で色を付ける単語（アプリに入っている単語・熟語）

function flowUnitsSet(st){ // 範囲に入るUnit（"本|Unit"）。null＝しぼらない

function startSession(mode,set,list){
  let items=[];
  if(list&&mode==="review")items=shuffle(list.slice()).map(w=>({id:w.id,phase:"quiz"}));
  else if(list&&mode==="new"){const ws=list;for(let i=0;i<ws.length;i+=5){const ch=ws.slice(i,i+5);ch.forEach(w=>items.push({id:w.id,phase:"intro"}));shuffle(ch).forEach(w=>items.push({id:w.id,phase:"quiz"}));}}
  else if(mode==="review")items=shuffle(dueList()).map(w=>({id:w.id,phase:"quiz"}));

  else if(mode==="new"){const ws=pickNew(newLeft());for(let i=0;i<ws.length;i+=5){const ch=ws.slice(i,i+5);ch.forEach(w=>items.push({id:w.id,phase:"intro"}));shuffle(ch).forEach(w=>items.push({id:w.id,phase:"quiz"}));}}
  else if(mode==="unit")items=shuffle(courseUnitWords(set)).map(w=>({id:w.id,phase:"quiz"}));
  else items=shuffle(S.words.filter(w=>w.set===set)).map(w=>({id:w.id,phase:"quiz"}));
  if(!items.length)return;
  Q={mode,set,items,i:0,res:{},requeued:{},n:0,c:0,done:false,combo:0,bestCombo:0,lastT:Date.now(),newMedals:[]};

}
function prepare(){
  const it=Q.items[Q.i];if(!it){finish();return;}

  Q.answered=false;Q.pick=null;Q.typed="";Q.slow=false;Q.shownAt=Date.now();
  Q.cur=it.phase==="intro"?{type:"intro",w}:buildQ(chooseType(w),w);

function chooseType(w){
  const t=S.settings.types;let el=[];
  if(t.en2ja)el.push("en2ja");if(t.ja2en)el.push("ja2en");
  if(t.cloze&&cloze(w))el.push("cloze");if(t.listen&&hasSpeech)el.push("listen");
  if(t.spell&&(w.stage>=2||Q.mode==="free")&&Q.mode!=="new"&&/^[A-Za-z'-]+$/.test(w.w))el.push("spell");

/* ---------- 似た意味の単語 ---------- */
// 日本語の意味の言葉が重なる語、英語の言い換えが同じ語・その単語そのものを「似た意味」としてつなぐ
let relIdx=null,relKey="";
const GENERIC=new Set(["する","こと","もの","人","の","な","よう","状態","ある","いる","ない","なる","させる","される"]);
function jaTokens(ja){
  return String(ja||"").replace(/[（(][^）)]*[）)]/g,"").split(/[、，,／\/;；・。]/).map(t=>t.trim()
    .replace(/^[〜～…]+(を|に|が|と|から|で|へ)?/,"").replace(/^(とても|非常に|めちゃくちゃ|かなり|すごく|ひどく|大いに|ちょっと|少し)/,"").replace(/^[\s・]+|[\s・]+$/g,"")).filter(t=>t.length>=2&&!GENERIC.has(t));
}
function buildRel(){
  const key=S.words.length+":"+S.words.reduce((a,w)=>a+(w.ja||"").length+(w.para||"").length+(w.syn||"").length,0);
  if(relIdx&&relKey===key)return relIdx;
  const tok=new Map(),eng=new Map(),add=(m,k,id)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(id);};
  S.words.forEach(w=>{new Set(jaTokens(w.ja)).forEach(t=>add(tok,t,w.id));
    add(eng,norm(w.w),w.id);if(w.para)String(w.para).split(/[;；,]/).map(x=>norm(x)).filter(x=>x.length>2).forEach(x=>add(eng,"p:"+x,w.id));
    if(w.syn)String(w.syn).split(/[,，;；]/).map(x=>norm(x)).filter(Boolean).forEach(x=>add(eng,"s:"+x,w.id));});
  relIdx={tok,eng};relKey=key;return relIdx;
}
function relatedOf(w,n=4){
  const {tok,eng}=buildRel(),score=new Map(),bump=(id,v)=>{if(id!==w.id)score.set(id,(score.get(id)||0)+v);};
  new Set(jaTokens(w.ja)).forEach(t=>{const ids=tok.get(t)||[];if(ids.length<=12)ids.forEach(id=>bump(id,1));});
  if(w.para)String(w.para).split(/[;；,]/).map(x=>norm(x)).filter(x=>x.length>2).forEach(x=>{
    (eng.get(x)||[]).forEach(id=>bump(id,3)); // 言い換えがその単語そのもの（approximately など）
    (eng.get("p:"+x)||[]).forEach(id=>bump(id,2));}); // 言い換えが同じ
  (eng.get("p:"+norm(w.w))||[]).forEach(id=>bump(id,3)); // ほかの語の言い換えがこの単語
  if(w.syn)String(w.syn).split(/[,，;；]/).map(x=>norm(x)).filter(Boolean).forEach(x=>(eng.get(x)||[]).forEach(id=>bump(id,3))); // 類義語が登録ずみの単語
  (eng.get("s:"+norm(w.w))||[]).forEach(id=>bump(id,3)); // ほかの語の類義語にこの単語がある
  return [...score.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id])=>byId(id)).filter(Boolean);
}
function extraHTML(w){ // 例文の訳・類義語・反対語
  return `${w.exJa?`<p class="exja">${esc(w.exJa)}</p>`:""}${w.syn||w.ant?`<p class="synant">${w.syn?`<span>≒</span>${esc(w.syn)}　`:""}${w.ant?`<span>⇔</span>${esc(w.ant)}`:""}</p>`:""}`;}
function relHTML(w){const rs=relatedOf(w);if(!rs.length)return"";
  return`<p class="rel"><span>似た意味</span>${rs.map(x=>`<b>${esc(x.w)}</b> ${esc(String(x.ja).slice(0,24))}`).join("　")}</p>`;}

function distract(w,key,n=3){
  const pool=shuffle(S.words.filter(x=>x.id!==w.id&&x.set===w.set)).concat(shuffle(S.words.filter(x=>x.id!==w.id&&x.set!==w.set)));
  const out=[],seen=new Set([norm(w[key])]),near=new Set(relatedOf(w,12).map(x=>x.id)); // 似た意味の語は答えがまぎらわしいので選択肢に入れない
  for(const x of pool){const k=norm(x[key]);if(!k||seen.has(k)||near.has(x.id))continue;seen.add(k);out.push(x);if(out.length>=n)break;}
  return out;
}
function buildQ(type,w){
  if(type==="spell")return{type,w};
  const key=(type==="ja2en"||type==="cloze"||type==="para")?"w":"ja";
  const q={type,w,key,opts:shuffle([w,...distract(w,key)]).map(x=>({id:x.id,text:x[key]}))};
  if(type==="cloze")q.cz=cloze(w);
  return q;
}
function speakCurrent(){if(!Q||Q.done||!Q.cur)return;if(Q.cur.type==="listen"||Q.cur.type==="intro")speak(Q.cur.w.w);}
function settle(ok){
  Q.answered=true;Q.ok=ok;const id=Q.cur.w.id;tick();
  if(ok){S.stats.correct++;Q.combo++;Q.bestCombo=Math.max(Q.bestCombo,Q.combo);S.stats.bestCombo=Math.max(S.stats.bestCombo,Q.combo);}else Q.combo=0;
  const r=Q.res[id]||(Q.res[id]={wrong:false});
  r.last=ok; // 最後に答えたときに正解したか
  // 考えた時間。設定の秒数をこえたら、正解でも「うろ覚え」扱い（つづりは3倍まで待つ）
  const sec=(Date.now()-(Q.shownAt||Date.now()))/1000,base=S.settings.slowSec||0,
    longQ=Q.cur.type==="cloze"||(Q.cur.type==="para"&&String(Q.cur.w.para||"").split(/\s+/).length>4),
    lim=base?base*(Q.cur.type==="spell"?3:1)+(longQ?5:0):0; // 文を読む問題は5秒おまけ
  Q.sec=Math.round(sec);Q.slow=ok&&lim>0&&sec>lim&&Q.mode!=="free";
  if(!ok){r.wrong=true;r.grade="bad";Q.requeued[id]=(Q.requeued[id]||0)+1;if(Q.requeued[id]<=10)Q.items.push({id,phase:"quiz"});}
  else if(Q.slow){r.grade="unsure";}
  else r.grade="ok";
  Q.n++;if(ok)Q.c++;
  const d=S.days[today()]||(S.days[today()]={n:0,c:0});d.n++;if(ok)d.c++;
  save();render();speak(Q.cur.w.w);
  const nb=document.querySelector(".grades")||document.getElementById("nextbtn");
  if(nb)setTimeout(()=>nb.scrollIntoView({block:"end",behavior:"smooth"}),50);
}
function next(){tick();if(flowTimeUp()&&!Q.done){finish();saveQ();render();window.scrollTo(0,0);return;}Q.i++;prepare();saveQ();render();window.scrollTo(0,0);speakCurrent();}
// 自分で決める3段階：◎完璧（もう出さない＝3ヶ月後に確認）・○OK（いつもの間隔）・▲うろ覚え（明日もう一度）
function grade(g){
  const id=Q.cur.w.id,r=Q.res[id];if(!r)return next();
  r.grade=g;
  if(g==="bad"){ // 正解でも当てずっぽうだったとき：まちがいと同じ扱い（この回でもう一度・間隔は最初から）
    if(!r.wrong){r.wrong=true;Q.combo=0;}r.last=false;
    Q.requeued[id]=(Q.requeued[id]||0)+1;if(Q.requeued[id]<=10)Q.items.push({id,phase:"quiz"});}
  if(g==="perfect"){Q.items=Q.items.filter((it,k)=>k<=Q.i||it.id!==id);} // この回ではもう出さない
  next();
}
function known(){ // 新しい単語の紹介で「もう知ってる」
  const w=Q.cur.w,t=today();w.stage=6;w.due=addDays(t,90);if(!w.learned)w.learned=t;delete w.soon;
  Q.items=Q.items.filter((it,k)=>k<=Q.i||it.id!==w.id);Q.known=(Q.known||0)+1;save();next();
}
function applySRS(){
  if(!Q||Q.mode==="free"||Q.mode==="unit"||Q.applied)return;Q.applied=true;const t=today();
  const gap=(S.settings.soonMin||0)*60000,later=Date.now()+gap;
  if(Q.mode==="soon"){
    Object.entries(Q.res).forEach(([id,r])=>{const w=byId(id);if(!w)return;
      if(r.grade==="perfect"){w.ok++;delete w.soon;w.stage=6;w.due=addDays(t,90);return;}
      if(r.wrong){w.ng++;w.soon=gap?later:null;}else{w.ok++;delete w.soon;}});
    save();return;
  }
  Object.entries(Q.res).forEach(([id,r])=>{const w=byId(id);if(!w)return;
    const firstTime=w.stage===0;delete w.soon;
    if(r.grade==="perfect"){w.ok++;if(!w.learned)w.learned=t;w.stage=6;w.due=addDays(t,90);return;}
    if(gap&&(r.wrong||firstTime||r.grade==="unsure"))w.soon=later;
    if(r.grade==="unsure"&&!r.wrong){w.ok++;if(!w.learned)w.learned=t;w.stage=Math.max(1,w.stage);w.due=addDays(t,1);return;}
    if(r.wrong){w.ng++;if(!w.learned)w.learned=t;w.stage=1;w.due=addDays(t,1);}
    else{w.ok++;const prev=w.stage;if(prev===0){w.stage=1;w.learned=t;}else w.stage=Math.min(prev+1,6);w.due=addDays(t,prev===6?90:DAYS[w.stage]);}
  });
  save();
}
function finish(){
  if(Q.done)return;applySRS();tick();
  const ids=Object.keys(Q.res);Q.total=ids.length;Q.first=ids.filter(id=>!Q.res[id].wrong).length;
  Q.rate=Q.total?Q.first/Q.total:0;Q.tier=tierOf(Q.rate);Q.stars=Q.total?Q.tier+1:0;Q.starsBefore=S.stats.stars;
  if(Q.total){S.stats.sessions++;S.stats.stars+=Q.stars;if(Q.tier===4)S.stats.perfect++;}
  recordTime();
  Q.newMedals=checkMedals();save();Q.done=true;
}

// 新しい単語は語数ごと、セット練習はセットごと、復習・おさらいは1語あたりの時間で比べる
const MODE_JA={new:"新しい単語",review:"今日の復習",soon:"おさらい",free:"セット練習"};
const fmtSec=sec=>sec<60?`${sec}秒`:`${Math.floor(sec/60)}分${sec%60?`${sec%60}秒`:""}`;
function recKey(){return Q.mode==="new"?`new:${Q.total}`:Q.mode==="free"?`set:${Q.set}`:Q.mode;}
function recName(k){const[m,x]=k.split(/:(.*)/);return m==="new"?`新しい単語 ${x}語`:m==="set"?`セット ${x}`:MODE_JA[m]||m;}
function recordTime(){
  Q.allOk=Q.total>0&&Object.values(Q.res).every(r=>r.last);
  Q.sec=Math.max(1,Math.round((Q.act||0)/1000));
  if(!Q.allOk)return;
  S.stats.best=S.stats.best||{};
  const k=recKey(),perWord=Q.mode==="review"||Q.mode==="soon";
  const score=perWord?Q.sec/Q.total:Q.sec,old=S.stats.best[k];
  const oldScore=old?(perWord?old.sec/old.n:old.sec):Infinity;
  Q.prevBest=old||null;
  if(score<oldScore){S.stats.best[k]={sec:Q.sec,n:Q.total,date:today()};Q.newBest=true;}
}
function timeHTML(){
  if(!Q.total)return"";
  const perWord=Q.mode==="review"||Q.mode==="soon",k=recKey(),b=(S.stats.best||{})[k];
  if(!Q.allOk)return`<p class="note">かかった時間 ${fmtSec(Q.sec)}（全問正解まで行かなかったので、記録には入りません）</p>`;
  return`<div class="time-rec${Q.newBest?" best":""}"><p class="label">全問正解までの時間</p><p class="mid">${fmtSec(Q.sec)}${perWord?`<small>（1語 ${(Q.sec/Q.total).toFixed(1)}秒）</small>`:""}</p>
    ${Q.newBest?`<p class="rankup pop">自己ベスト更新！${Q.prevBest?`（前は ${fmtSec(Q.prevBest.sec)}${perWord?`・1語 ${(Q.prevBest.sec/Q.prevBest.n).toFixed(1)}秒`:""}）`:""}</p>`
      :`<p class="note">自己ベスト ${fmtSec(b.sec)}${perWord?`（1語 ${(b.sec/b.n).toFixed(1)}秒）`:""}・${recName(k)}</p>`}</div>`;
}
function bestsHTML(){
  const bs=Object.entries((S.stats&&S.stats.best)||{});if(!bs.length)return"";
  const order=k=>k.startsWith("new:")?Number(k.slice(4)):k.startsWith("set:")?1e6:k==="review"?-2:-1;
  bs.sort((a,b)=>order(a[0])-order(b[0])||a[0].localeCompare(b[0]));
  return`<section><h2>自己ベスト <span class="note">全問正解までの時間</span></h2><div class="card bests">${bs.map(([k,b])=>{const pw=k==="review"||k==="soon";
    return`<div class="best-row"><span>${esc(recName(k))}</span><b>${fmtSec(b.sec)}${pw?`<small> 1語${(b.sec/b.n).toFixed(1)}秒</small>`:""}</b><small>${md(b.date)}</small></div>`;}).join("")}</div></section>`;

const NOISE=["back to course","words to remember","list of words","review the words","continue","learned","free mode","practice","tap the +","must finish","my words","when you are ready"];
// 1行に「英語　日本語」が並ぶ単語帳（熟語集など）と、英語の行のあとに日本語の行がまとめて並ぶ形（iPhoneの文字読み取りなど）
function parseRows(lines){
  const JA=/[぀-ヿ㐀-鿿]/,LAT=/[A-Za-z]{2,}/;
  const cleanEn=e=>e.replace(/[_|]+/g," ").replace(/\s+/g," ").trim().replace(/^[^A-Za-z(〜～~]+|[^A-Za-z)〜～~.']+$/g,"")
    .split(" ").map(t=>t.length>1&&/^[A-Za-z]+$/.test(t)?t.toLowerCase():t).join(" ");
  const cleanJ=j=>cleanJa(j).replace(/\s+/g," ").trim();
  const split=line=>{const j=line.search(JA);if(j<=0)return null;let en=line.slice(0,j).replace(/[_|]+/g," "),ja=line.slice(j);
    // 表の形「単語 [発音] [#2] 意味」：[ ] の中の発音を取り出し、番号やしるしは捨てる
    let ipa="";en=en.replace(/\[([^\]]*)\]?/g,(m0,x)=>{if(!ipa&&!/^#|^\d/.test(x)&&x.length>1)ipa=x.trim();return " ";}).replace(/^\s*[\d.()]+\s*/,"");
    ja=ja.replace(/\s+\d+\s*$/,"");
    if(!LAT.test(en))return null;
    // 「A から離れる」のように、意味が A/B などの記号＋助詞で始まるときは記号を意味の側へ
    const mm=en.match(/^(.*\S)\s+([A-Z]|[〜～~])\s*$/);if(mm&&/^(を|に|が|から|と|で|へ|の|より|として)/.test(ja)){en=mm[1];ja=mm[2]+" "+ja;}
    const mp=en.match(/^(.*?)\s*[(（]\s*([A-Z]|[〜～~])?\s*$/);if(mp&&mp[1]&&/[)）]?$/.test(mp[1])){en=mp[1];ja="("+(mp[2]?mp[2]+" ":"")+ja;} // 「(from A)(A から)逃げる」
    en=cleanEn(en);if(/to remember/i.test(en))return null;return en.length>=2?{w:en,ja:cleanJ(ja),ex:"",ipa}:null;};
  // 表の何行分かが1行につながったときは、「意味」のあとに「単語 [」が来るところで行を分ける
  lines=lines.flatMap(l=>l.replace(/([぀-ヿ㐀-鿿）)])[\s\d.]*(?=[A-Za-z][A-Za-z'\- ]{0,30}\s*\[)/g,"$1\n")
    // 2列のページ：左の意味のあとに右の列の熟語が続くときは、そこで分ける
    .replace(/([぀-ヿ㐀-鿿）)\]])\s+(?=[a-z][a-z'\-]+[^぀-ヿ㐀-鿿]*[぀-ヿ㐀-鿿])/g,"$1\n")
    .replace(/([぀-ヿ㐀-鿿）)])\s+(?=[a-z\s]{0,8}\((from|to|on|at|with|of|in|for|about|into|by)\b)/g,"$1\n").split("\n")).map(s=>s.trim()).filter(Boolean);
  const rows=lines.map(split);const hit=rows.filter(Boolean).length;
  if(hit>=2&&hit>=lines.filter(l=>LAT.test(l)).length*0.4){
    // 横並びの表：日本語が読めなかった行も英語だけ残して、確認画面で意味を入れてもらう
    return lines.map((l,i)=>rows[i]||(!JA.test(l)&&LAT.test(l)&&l.length<70&&!/[.?!]$/.test(l)&&!/to remember/i.test(l)?{w:cleanEn(l),ja:"",ex:""}:null)).filter(x=>x&&x.w);
  }
  // 英語の行が続いたあと、同じ数の日本語の行が続く形
  // 列ごとに読み取られた表：見出し（単語・発音・意味）と [発音] だけの行は分けておく
  const ipaLines=lines.filter(l=>/^\[[^\]]*\]?$/.test(l)).map(l=>l.replace(/[\[\]]/g,"").trim());
  lines=lines.filter(l=>!/^\[[^\]]*\]?$/.test(l)&&!/^(G|No\.?|番号|単語|発音|意味|訳|日本語)$/i.test(l)&&!/to remember/i.test(l));
  const sentence=l=>/[.?!"”]$/.test(l)||l.split(" ").length>8;
  const kind=lines.map(l=>JA.test(l)?"J":LAT.test(l)?"E":"-");const out=[];let used=0;
  for(let i=0;i<lines.length;){
    if(kind[i]!=="E"){i++;continue;}
    let a=i;while(a<lines.length&&kind[a]==="E")a++;let b=a;while(b<lines.length&&kind[b]==="J")b++;
    const ne=a-i,nj=b-a;
    if(ne===nj&&!lines.slice(i,a).some(sentence)){for(let k=0;k<ne;k++)out.push({w:cleanEn(lines[i+k]),ja:cleanJ(lines[a+k]),ex:""});used+=ne*2;i=b;}else i=a;
  }
  // 例文つきの単語帳（英単語・意味・例文の順）はこれまでの読み方に任せる
  if(ipaLines.length===out.length)out.forEach((o,k)=>{o.ipa=ipaLines[k];});
  return out.length>=2&&used>=kind.filter(k=>k!=="-").length*0.8?out:null;
}
// 写真から読み取った結果の手直し：英語として読めない行をはぶき、くっついた意味のない文字を取る
function tidyOcr(items){
  const ok=t=>{const x=t.toLowerCase().replace(/[^a-z'\-]/g,"");if(!x)return false;
    return /^(a|b|c|sb|sth|one's|oneself|someone|something)$/.test(x)||!!(IPA&&(IPA[x]||IPA[x.replace(/'s$/,"")]))||(!IPA&&x.length>2);};
  const words=w=>w.split(/[\s\/]+/).filter(Boolean);
  const SHORT=new Set(["be","go","do","up","on","in","it","at","by","of","to","so","no","my","me","we","us","he","an","as","or","if"]);
  return items.map(it=>{
    let w0=it.w.replace(/^[^A-Za-z(〜～~]+/,"");
    // 「keep away A / keep A away」：うしろ半分の最初の動詞より前は、となりのページの文字なので切る
    const sl=w0.split(" / ");if(sl.length===2){const v=sl[1].trim().split(" ")[0].toLowerCase();const k=sl[0].toLowerCase().split(" ").lastIndexOf(v);
      if(v.length>=2&&k>0)w0=sl[0].split(" ").slice(k).join(" ")+" / "+sl[1];}
    let ts=w0.split(" ");
    while(ts.length>1&&(/[^A-Za-z'()\/〜～~\-]/.test(ts[0])||(ts[0].replace(/[^A-Za-z]/g,"").length<=2&&!SHORT.has(ts[0].toLowerCase())))&&ts.slice(1).some(ok))ts.shift(); // 前のゴミ（記号まじり・1〜2文字のかけらだけ。読みまちがえた単語は消さない）
    while(ts.length>1&&!ok(ts[ts.length-1])&&ts[ts.length-1].length<=6&&ts.slice(0,-1).some(ok))ts.pop(); // うしろのゴミ
    let w=ts.join(" ").replace(/[\s\/]+$/,"").replace(/\)\s*\([A-Z0-9]{2,}\)?$/,")"); // 「(to A)(AID)」の読みまちがい
    {const h=w.split(" / ");if(h.length===2&&/ [A-Z]$/.test(h[1])&&h[1].split(" ").length>h[0].split(" ").length)w=h[0]+" / "+h[1].replace(/ [A-Z]$/,"");}
    const ws=words(w).filter(t=>/[A-Za-z]/.test(t));const good=ws.filter(ok).length;
    const real=ws.filter(t=>ok(t)&&t.replace(/[^A-Za-z]/g,"").length>=3&&!/^(sb|sth)$/i.test(t)).length;
    const shortish=ws.filter(t=>{const x=t.replace(/[^A-Za-z]/g,"");return x.length<=2&&!SHORT.has(x.toLowerCase())&&!/^[A-Z]$/.test(x);}).length;
    if(!ws.length||!real||good<Math.max(1,ws.length*0.6)||/to remember/i.test(w)||shortish>ws.length/2&&ws.length>3)return null; // 英語として読めない行・見出し
    if(!it.ja&&ws.length===1&&/^(unit|part|lesson|chapter|page|day|step|stage|level|section|review)$/i.test(w))return null;
    let ja=String(it.ja||"").replace(/\[[^\]]*\]?/g," ").replace(/(^|\s)(?!A(\s|$))[A-Za-z]{2,}(?=\s|$)/g," ") // 発音記号や品詞マークの読みまちがい
      .replace(/^[^぀-ヿ㐀-鿿(（A]+/,"").replace(/^[ー一－―‐\s]+/,"").replace(/^[぀-ヿ㐀-鿿]{1,2}\s+(?=A\s|[(（])/,""); // 「ん A をしまう」の「ん」（品詞マークの読みまちがい）
    for(let k=0;k<2;k++)ja=ja.replace(/[^぀-ヿ㐀-鿿）)]+$/,"").replace(/[ー一－―‐\-—_~*?？\s]+$/,"");
    ja=ja.replace(/\s+/g," ").trim();
    if((ja.match(/[぀-ヿ㐀-鿿]/g)||[]).length<2)ja="";
    let ex=it.ex||"";const et=ex.split(/\s+/).filter(t=>/[A-Za-z]/.test(t));
    if(ex&&(et.length<3||et.filter(ok).length<et.length*0.6))ex=""; // くずれた例文

function parseAiReply(text){
  const block=text.match(/```(?:json)?\s*([\s\S]*?)```/);const body=block?block[1]:text;
  const a=body.indexOf("{"),b=body.lastIndexOf("}");if(a<0||b<=a)throw new Error("nojson");
  const d=JSON.parse(body.slice(a,b+1)),str=v=>v==null?"":String(v).trim();
  const items=(Array.isArray(d.words)?d.words:[]).filter(w=>w&&(w.word||w.surface)).map(w=>({
    w:str(w.word||w.surface),ja:str(w.meaning_ja||w.meaning),ex:str(w.sentence),
    para:str(w.meaning_en),syn:str(w.syn),ant:str(w.ant),exJa:str(w.sentence_ja),ipa:str(w.reading).replace(/^\/+|\/+$/g,"").replace(/^\[|\]$/g,""),pos:str(w.pos),note:str(w.note),set:str(w.set)}));
  const prio=Number(d.prio)||0;items.forEach((it,k)=>{const wp=Number((d.words[k]||{}).prio)||0;it.prio=wp||prio||(it.ex?2:1);});
  const grammar=(Array.isArray(d.grammar)?d.grammar:[]).filter(q=>q&&(q.question||q.q)).map(q=>{
    const ch=Array.isArray(q.choices)?q.choices.map(str):[];
    const type=["mc","input","order"].includes(q.type)?q.type:(ch.length>=2?"mc":"input");
    const ans=type==="mc"?Number(q.answer)||0:Array.isArray(q.answer)?q.answer.map(str):str(q.answer);
    return{type,q:str(q.question||q.q),choices:ch,answer:ans,exp:str(q.explanation||q.exp),src:str(q.source||q.src),set:str(q.set)};
  }).filter(g=>g.type==="mc"?g.choices.length>=2&&g.answer>=0&&g.answer<g.choices.length:!!gAns(g));
  const lessons=(Array.isArray(d.lessons)?d.lessons:[]).filter(l=>l&&(l.title||l.body)).map((l,k)=>({set:str(l.set),title:str(l.title)||`解説${k+1}`,body:str(l.body),points:Array.isArray(l.points)?l.points.map(str).filter(Boolean):[],order:Number(l.order)||k}));
  const seen=new Set();return{share:!!d.share,set:str(d.set),grammar,lessons,items:items.filter(it=>{const k=norm(it.w);if(seen.has(k))return false;seen.add(k);return true;})};
}

const SHARE_TAG="CDRILL1:";
const b64enc=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const b64dec=t=>{const s=atob(t);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
async function packText(str){
  if(typeof CompressionStream==="undefined")return str; // 古いスマホはそのままの文字で
  const cs=new Blob([str]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return SHARE_TAG+b64enc(await new Response(cs).arrayBuffer());
}
async function unpackText(code){
  const ds=new Blob([b64dec(code)]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return await new Response(ds).text();
}
async function takeAny(text){ // 貼りつけた文：送るコードなら開いてから取りこむ
  const m=String(text||"").match(/CDRILL1:([A-Za-z0-9+\/=\s]+)/);
  if(m){try{text=await unpackText(m[1].replace(/\s+/g,""));}catch(e){toast("コードが読み取れませんでした。メッセージ全体をコピーしてください");return;}}
  aiTake(text);
}

  if(a==="g-new")return gStart("new");
  if(a==="g-set")return gStart("set",b.dataset.set);
  if(a==="g-known"){const g=G&&G.cur;if(!g||g.wid)return;const real=gAll().find(x=>x.id===g.id)||g;real.known=!real.known;if(real!==g)g.known=real.known;save();render();toast(real.known?"この問題はもう出しません":"また出すようにしました");return;}
  if(a==="c-unknown"){const u=courseUnits(courseBook).find(x=>x.unit===b.dataset.u);if(!u)return;const n=u.gram.filter(g=>g.known).length;if(!n||!confirm(`「もう出さない」にした${n}問を、また出すようにしますか？`))return;u.gram.forEach(g=>delete g.known);save();render();toast(`${n}問をまた出すようにしました`);return;}
  if(a==="g-pick"){if(G.answered)return;G.pick=Number(b.dataset.k);return gSettle(G.pick===G.cur.answer);}
  if(a==="g-check"){if(!G.answered)gCheck();return;}
  if(a==="g-tile"){const x=G.tiles.splice(Number(b.dataset.i),1)[0];if(x)G.built.push(x);render();return;}
  if(a==="g-unt"){const x=G.built.splice(Number(b.dataset.i),1)[0];if(x)G.tiles.push(x);render();return;}
  if(a==="g-next"){gTick();if(flowTimeUp()){gFinish();render();window.scrollTo(0,0);return;}G.i++;gPrep();render();window.scrollTo(0,0);return;}
  if(a==="g-course"){if(F){flowNext();return;}G=null;view="course";render();window.scrollTo(0,0);return;}
  if(a==="g-home"&&F){flowNext();return;}
  if(a==="g-quit")F=null;
  if(a==="g-quit"||a==="g-home"){if(G&&!G.done){gTick();save();}G=null;view="home";render();window.scrollTo(0,0);return;}
  if(a==="grade")return grade(b.dataset.g);
  if(a==="known")return known();
  if(a==="quit"){F=null;tick();applySRS();checkMedals();save();Q=null;view="home";render();if(true)toast("ここまでの結果を保存しました");return;}
  if(a==="home"){if(F){flowNext();return;}Q=null;view="home";render();window.scrollTo(0,0);return;}
  if(a==="parse"){
    draft=document.getElementById("paste").value;
    const p=parseText(draft);const sn=document.getElementById("setname").value.trim();
    preview={set:sn||p.set,items:p.items};render();
    const el=document.getElementById("preview");if(el&&preview.items.length)el.scrollIntoView({behavior:"smooth",block:"start"});return;
  }
  if(a==="aimode"){aiMode=b.dataset.m;render();return;}
  if(a==="ai-copy"){const t=aiPrompt(aiMode);
    const fb=()=>{aiFallback=true;render();const ta=document.getElementById("ai-text");ta.value=t;ta.focus();ta.select();toast("自動でコピーできませんでした。下の文章を長押ししてコピーしてください");};
    try{navigator.clipboard.writeText(t).then(()=>toast("コピーしました。Claudeのアプリに貼りつけてください"),fb);}catch(e){fb();}return;}
  if(a==="ai-paste"){
    const fb=()=>{aiFallback=true;render();document.getElementById("ai-text").focus();toast("下の欄に長押しで貼りつけて、「この内容で取りこむ」を押してください");};
    try{navigator.clipboard.readText().then(t=>t&&t.trim()?takeAny(t):toast("コピーされた内容がありません"),fb);}catch(e){fb();}return;}
  if(a==="ai-take"){takeAny(document.getElementById("ai-text").value);return;}
  if(a==="share-make"){const sel=new Set(shareSel),ws=shareWords(sel),gs=shareGrammar(sel);
    const uset=new Set([...sel].map(k=>{const n=k.replace(/^g:/,"");return bookOf(n)+"|"+unitOf(n);}));
    const ls=lAll().filter(l=>uset.has(bookOf(l.set)+"|"+unitOf(l.set))).map(l=>({set:l.set,title:l.title,body:l.body,points:l.points,order:l.order}));
    const json=JSON.stringify({set:"",share:true,words:ws,grammar:gs,lessons:ls,questions:[]});shareJson=json;
    packText(json).then(code=>{const names=[...sel];
      const nm=names.map(n=>n.replace(/^g:/,"文法："));
      shareMsg=`C単語ドリルの単語（${nm.length>2?nm.slice(0,2).join("、")+` ほか${nm.length-2}セット`:nm.join("、")}・${ws.length}語${gs.length?`・文法${gs.length}問`:""}）です。\nこのメッセージを長押しでコピーして、単語ドリルの「追加」→「② 貼りつけて取りこむ」を押してね。\n${code}`;
      const res=document.getElementById("share-res");if(res)res.innerHTML=shareResHTML();else render();
      const el=document.getElementById("share-out");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});});return;}
  if(a==="share-file"){const d=new Date(),name=`単語ドリル_${d.getMonth()+1}月${d.getDate()}日.json`;
    const file=new File([shareJson],name,{type:"application/json"});
    const dl=()=>{const u=URL.createObjectURL(file),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("ファイルを保存しました。LINEでそのファイルを送ってください");};
    try{if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:name}).catch(()=>{});else dl();}catch(e){dl();}return;}
  if(a==="share-send"){if(navigator.share){navigator.share({text:shareMsg}).catch(()=>{});}else{location.href="https://line.me/R/share?text="+encodeURIComponent(shareMsg);}return;}
  if(a==="share-copy"){const ta=document.getElementById("share-out");const sel=()=>{ta.focus();ta.select();toast("選択しました。長押しでコピーしてください");};
    try{navigator.clipboard.writeText(shareMsg).then(()=>toast("コピーしました。LINEに貼りつけて送ってください"),sel);}catch(e){sel();}return;}
  if(a==="commit-big"){
    const up=x=>/^[a-z]+\d+$/i.test(x)?x.toUpperCase():x;
    const top=up(document.getElementById("setname").value.trim()||preview.set||"");
    const byW=new Map(S.words.map(w=>[norm(w.w),w])),used=new Set();let added=0,upd=0;
    preview.items.forEach(it=>{if(!it.w||!it.ja)return;
      const old=byW.get(norm(it.w));
      if(old){ // 別の単語帳とかぶった語：覚えた記録はそのまま、くわしいほうの単語帳の中身にする
        const op=old.prio||(old.ex?2:1),np=it.prio||(it.ex?2:1),win=np>=op;
        if(win){old.ja=it.ja;if(it.ex)old.ex=it.ex;if(it.ipa)old.ipa=it.ipa;if(it.para)old.para=it.para;old.prio=np;
          ["syn","ant","exJa"].forEach(k=>{if(it[k])old[k]=it[k];});
          if(np>op){const ws=it.set?(top?top+" "+it.set:it.set):(top||old.set);old.set=ws;used.add(ws);}} // 優先する単語帳のセットに移す
        else{if(!old.ex&&it.ex)old.ex=it.ex;if(!old.ipa&&it.ipa)old.ipa=it.ipa;if(!old.para&&it.para)old.para=it.para;} // 足りないところだけ補う
        if(it.note){const ns=new Set((old.note||"").split("・").filter(Boolean));it.note.split("・").forEach(x=>x&&ns.add(x));old.note=[...ns].join("・");}
        upd++;return;}
      const ws=it.set?(top?top+" "+it.set:it.set):(top||"追加");used.add(ws);
      const nw=Object.assign({id:uid(),set:ws,w:it.w,ja:it.ja,ex:it.ex||"",stage:0,due:null,ok:0,ng:0,learned:null,prio:it.prio||(it.ex?2:1)},it.ipa?{ipa:it.ipa}:{},it.note?{note:it.note}:{},it.para?{para:it.para}:{});
      ["syn","ant","exJa"].forEach(k=>{if(it[k])nw[k]=it[k];});
      S.words.push(nw);byW.set(norm(it.w),nw);added++;});
    relKey="";save();preview=null;draft="";ocrMsg="";render();toast(`${used.size?`${used.size}セットに${added}語を追加`:"追加はなし"}${upd?`・${upd}語を更新`:""}しました`);return;}
  if(a==="commit"){
    const up=x=>/^[a-z]+\d+$/i.test(x)?x.toUpperCase():x;
    const top=up(document.getElementById("setname").value.trim()||preview.set||"");
    const set=top||"追加";const used=new Set();
    let added=0,upd=0,skip=0;
    preview.items.forEach((_,i)=>{if(!document.getElementById("pv-c"+i).checked)return;
      const w=document.getElementById("pv-w"+i).value.trim(),ja=document.getElementById("pv-j"+i).value.trim(),ex=document.getElementById("pv-e"+i).value.trim();
      if(!w||!ja){skip++;return;}const it=preview.items[i],same=norm(it.w)===norm(w);
      const sub=preview.groups?((document.getElementById("pv-s"+i)||{}).value||"").trim():"";
      const ws=sub?(top?top+" "+sub:sub):set;used.add(ws);
      upsert(ws,w,ja,ex,same?{ipa:it.ipa,note:it.note,para:it.para,syn:it.syn,ant:it.ant,exJa:it.exJa,prio:it.prio}:{prio:it.prio})?added++:upd++;});
    save();preview=null;draft="";ocrMsg="";render();toast(`${used.size>1?`${used.size}セットに`:([...used][0]||set)+" に"}${added}語を追加${upd?`・${upd}語を更新`:""}しました${skip?`（意味が空の${skip}語はとばしました）`:""}`);return;
  }
  if(a==="add-one"){
    const w=document.getElementById("m-w").value.trim(),ja=document.getElementById("m-j").value.trim(),ex=document.getElementById("m-e").value.trim(),set=(document.getElementById("m-s").value.trim()||"追加").toUpperCase();
    if(!w||!ja){toast("英単語と意味を入れてください");return;}
    const isNew=upsert(set,w,ja,ex);save();render();toast(isNew?`${w} を追加しました`:`${w} を更新しました`);return;
  }
  if(a==="toggle"){openId=openId===b.dataset.id?null:b.dataset.id;confirmDel=null;document.getElementById("rows").innerHTML=rowsHTML();return;}
  if(a==="del"){const id=b.dataset.id;if(confirmDel!==id){confirmDel=id;document.getElementById("rows").innerHTML=rowsHTML();return;}
    const w=byId(id);S.words=S.words.filter(x=>x.id!==id);confirmDel=null;openId=null;save();render();toast(`${w?w.w:""} を削除しました`);return;}
  if(a==="slowsec"){S.settings.slowSec=Number(b.dataset.n);save();render();return;}
  if(a==="soonmin"){S.settings.soonMin=Number(b.dataset.n);if(!S.settings.soonMin)S.words.forEach(w=>delete w.soon);save();render();return;}
  if(a==="perday"){S.settings.perDay=Number(b.dataset.n);save();render();return;}
  if(a==="mk-backup"){try{backup=btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(err){backup="";toast("コードを作れませんでした");}render();return;}
  if(a==="copy-backup"){const ta=document.getElementById("bk-out");
    const sel=()=>{ta.focus();ta.select();toast("選択しました。長押しでコピーしてください");};
    try{navigator.clipboard.writeText(backup).then(()=>toast("コピーしました"),sel);}catch(err){sel();}return;}
  if(a==="restore"){const raw=document.getElementById("bk-in").value.replace(/\s+/g,"");
    if(!raw){toast("コードを貼りつけてください");return;}
    let o;try{o=JSON.parse(decodeURIComponent(escape(atob(raw))));}catch(err){toast("コードが読み取れません。全部コピーできているか確認してください");return;}
    if(!o||!Array.isArray(o.words)){toast("コードが読み取れません");return;}
    if(!confirmRestore){confirmRestore=true;const keep=raw;render();document.getElementById("bk-in").value=keep;return;}
    S=o;normalize();
    confirmRestore=false;save();render();toast(`${S.words.length}語の記録を戻しました`);return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="c-book"){courseBook=t.value;courseOpen="";render();return;}
  if(["f-min","f-mode","f-book","f-unit"].includes(t.id)){const st=S.settings.flow=Object.assign({min:15,mode:"auto",book:"all",unit:"all"},S.settings.flow||{});
    if(t.id==="f-min")st.min=Number(t.value);if(t.id==="f-mode")st.mode=t.value;if(t.id==="f-book"){st.book=t.value;st.unit="all";}if(t.id==="f-unit")st.unit=t.value;
    save();if(t.id==="f-book")render();return;}
  if(t.dataset&&t.dataset.share!==undefined){if(t.checked)shareSel.add(t.dataset.share);else shareSel.delete(t.dataset.share);shareRefresh();return;}
  if(t.dataset&&t.dataset.sharebook!==undefined){document.querySelectorAll("[data-share]").forEach(k=>{if(k.dataset.sbook===t.dataset.sharebook){k.checked=t.checked;if(t.checked)shareSel.add(k.dataset.share);else shareSel.delete(k.dataset.share);}});shareRefresh();return;}
  if(t.dataset&&t.dataset.book!==undefined){S.settings.newOff=S.settings.newOff||{};if(t.checked)delete S.settings.newOff[t.dataset.book];else S.settings.newOff[t.dataset.book]=true;save();return;}
  if(t.dataset&&t.dataset.aifile!==undefined){const f=t.files&&t.files[0];if(!f){toast("ファイルが選ばれていません");return;}
    toast(`${f.name} を読みこみ中…`);
    const done=txt=>{t.value="";if(!txt||!txt.trim()){toast("ファイルの中身が空でした");return;}takeAny(txt);};
    const fail=err=>{t.value="";toast("ファイルを読めませんでした（"+((err&&err.message)||"不明")+"）。一度スマホに保存してから選んでください");};
    try{const r=new FileReader();r.onload=()=>done(String(r.result||""));r.onerror=()=>fail(r.error);r.readAsText(f,"utf-8");}catch(err){fail(err);}
    return;}
  if(t.dataset&&t.dataset.ocr){const fs=[...t.files];t.value="";runOCR(fs,t.dataset.ocr);return;}
  if(t.dataset&&t.dataset.type){
    S.settings.types[t.dataset.type]=t.checked;
    if(!Object.values(S.settings.types).some(Boolean)){S.settings.types[t.dataset.type]=true;t.checked=true;toast("1つ以上は選んでください");}
    save();return;
  }
  if(t.id==="fset"){listSet=t.value;openId=null;document.getElementById("rows").innerHTML=rowsHTML();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){listQ=e.target.value;document.getElementById("rows").innerHTML=rowsHTML();}
  if(e.target.id==="paste")draft=e.target.value;
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="g-in"&&G&&!G.answered){e.preventDefault();gCheck();return;}
  if(e.key==="Enter"&&e.target.id==="spell"&&Q&&!Q.answered){e.preventDefault();const v=e.target.value;Q.typed=v;settle(norm(v)===norm(Q.cur.w.w));}
});
setInterval(()=>{if(view==="home"&&!Q&&soonAll().length)render();},30000);
// 成長ログが単語を足していることがあるので、開き直したときは保存データを読み直す
document.addEventListener("visibilitychange",()=>{if(document.hidden){tick();saveQ();return;}if(!Q){if(!preview)load();render();}});
window.addEventListener("pagehide",()=>{tick();saveQ();});

// 新しい版が公開されていたら、そのまま読みこみ直す（スマホが古い版を覚えていても切り替わるように）
function checkUpdate(){
  try{fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
    const m=t.match(/const APP_VER="([^"]+)"/);if(!m||m[1]===APP_VER)return;
    let tried="";try{tried=sessionStorage.getItem("c-drill-upd")||"";}catch(e){}
    if(tried===m[1])return;try{sessionStorage.setItem("c-drill-upd",m[1]);}catch(e){}
    saveQ();location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));}).catch(()=>{});}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate();});
load();const resumed=restoreQ();save();render();checkUpdate();
if(resumed&&!Q.done)toast("途中から再開しました");
fetch("ipa.json").then(r=>r.ok?r.json():null).then(o=>{if(!o)return;IPA=o;
  if(view==="add"&&!Q)return; // 入力中の欄を消さない
  if(Q&&!Q.answered&&Q.cur&&Q.cur.type==="spell")return;
  render();}).catch(()=>{});
</script>
