<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C単語ドリル">
<meta name="theme-color" content="#FFFFFF">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>C単語ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-column phone app — highlighter-marked word cards on cool paper, bottom tab bar */
/* White background by request: single light theme on purpose */
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#22254D; --muted:#646891; --line:#E3E5F0; --soft:#F2F3F9;
  --hl:#FFE14F; --hl-ink:#22254D; --tint:#EEF0FF; --white:#FFFFFF;
  --primary:#2F35A6; --on-primary:#FFFFFF;
  --ok:#137A51; --ok-bg:#DCF2E6; --ng:#C23733; --ng-bg:#FBE2E1;
  --bronze:#B9773E; --silver:#8E98AB; --gold:#D29C0C; --plat:#2F9BC0; --locked:#E7E9F2;
  --f-word:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}

body{background:var(--paper);color:var(--ink);font-family:var(--f-ja);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.app{max-width:560px;margin:0 auto;padding-block:18px 110px;display:flex;flex-direction:column;gap:20px}
h1,h2,p{margin:0}
h1{font-size:24px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
h2{font-size:15px;font-weight:700}
.eyebrow,.label,.kicker{font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.note{font-size:12.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
section{display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.streak{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.streak b{font-family:var(--f-word);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}

button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn{border:1.5px solid var(--primary);background:transparent;color:var(--primary);border-radius:999px;padding:10px 18px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%;padding:14px}
.ghost{border:0;background:none;color:var(--muted);font-weight:700;padding:6px 0}
.danger{border-color:var(--ng);color:var(--ng)}

.hero{padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero-row.sub{border-top:1px dashed var(--line);padding-top:14px}
.big{font-family:var(--f-word);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-family:var(--f-word);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.big small,.mid small{font-family:var(--f-ja);font-size:14px;margin-left:3px;color:var(--muted)}

.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.fc div{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.fc .n{font-family:var(--f-word);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.fc .b{width:100%;max-width:30px;background:var(--hl);border-radius:6px 6px 2px 2px;min-height:3px}
.fc .b.zero{background:var(--soft)}
.fc .d{font-size:10.5px;color:var(--muted);white-space:nowrap}

.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.set{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:center;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.set-name{font-family:var(--f-word);font-weight:800;font-size:18px;grid-row:span 2}
.set-num{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}

mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 .08em}
.qhead{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);transition:width .25s}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.qcard{padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.word{font-family:var(--f-word);font-size:clamp(32px,10vw,44px);font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.ja{font-size:19px;font-weight:700}
.ex{font-family:var(--f-word);font-weight:600;font-size:16px;line-height:1.55;color:var(--ink);max-width:36ch}
.ex.cz{font-size:18px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--primary);margin:0 .15em}
.hint{font-size:13px;color:var(--muted)}
.say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.say svg{width:16px;height:16px}
.play{width:88px;height:88px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.play svg{width:38px;height:38px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;min-height:52px}
.opt.en{font-family:var(--f-word);font-weight:600;font-size:18px}
.opt.is-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.is-ng{border-color:var(--ng);background:var(--ng-bg);color:var(--ng)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.spell{width:100%;font-family:var(--f-word);font-size:24px;font-weight:600;text-align:center;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.ng{background:var(--ng-bg);border-color:var(--ng)}
.verdict{font-weight:900;font-size:17px}
.fb.ok .verdict{color:var(--ok)} .fb.ng .verdict{color:var(--ng)}
.ipa{font-family:"Lucida Sans Unicode","Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;color:var(--muted);font-size:16px;margin:2px 0 4px;letter-spacing:.02em}
.fb .ipa{margin-top:-2px}
.fb-word{font-family:var(--f-word);font-weight:800;font-size:22px}
.fb-word span{font-family:var(--f-ja);font-size:15px;font-weight:700;margin-left:8px}
.fb .ex{max-width:none;font-size:15px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.sum{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.miss{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.miss li{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.miss b{font-family:var(--f-word);font-size:17px}

.photo-btns{display:flex;flex-direction:column;gap:10px}
.ai{padding:16px;display:flex;flex-direction:column;gap:10px}
.ai h2{margin:0}.ai .tag{font-size:11px;background:var(--primary);color:var(--on-primary);border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:4px}
.ai details textarea{margin-top:6px}.ai details .btn{margin-top:8px}
.sub-h{font-size:15px;margin:8px 0 0}
.pv-meta{font-size:12px;color:var(--muted);line-height:1.4}
.tip{font-size:13px;color:var(--muted);margin:6px 0 0;text-align:left}
.photo{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-sizing:border-box;white-space:normal;text-align:center}
.photo svg{width:20px;height:20px;flex:none}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo.off{opacity:.45;pointer-events:none}
.ocr-st{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;margin:0}
.ocr-st.err{background:var(--ng-bg);color:var(--ng);border-color:transparent}
.spin{width:14px;height:14px;border:2.5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.steps-ol{margin:4px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps-ol .note{display:block}
.steps{padding:14px 16px}
.steps ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.steps .note{display:block}
textarea,input[type=text],input[type=search],select{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.pv{display:flex;flex-direction:column;gap:8px}
.pv-row{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:10px;align-items:start}
.pv-row .inputs{display:flex;flex-direction:column;gap:6px;min-width:0}
.pv-row input[type=text]{padding:7px 10px;font-size:14px}
.pv-row .w{font-family:var(--f-word);font-weight:600}
.pv-row input[type=checkbox]{width:20px;height:20px;margin-top:8px;accent-color:var(--primary)}
.dup{font-size:11.5px;color:var(--muted)}
.manual{padding:12px 16px}
.manual summary{font-weight:700;cursor:pointer}
.manual .field{margin-top:10px}
.manual .btn{margin-top:10px}

.filters{display:grid;grid-template-columns:1fr 110px;gap:8px}
.wrow{border-bottom:1px solid var(--line)}
.wrow-main{width:100%;display:grid;grid-template-columns:minmax(0,auto) 1fr auto;gap:10px;align-items:baseline;background:none;border:0;text-align:left;padding:11px 2px}
.ww{font-family:var(--f-word);font-weight:600;font-size:17px}
.wj{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.s1,.chip.s2{background:var(--ng-bg);color:var(--ng)}
.chip.s3,.chip.s4{background:var(--hl);color:var(--hl-ink)}
.chip.s5,.chip.s6{background:var(--ok-bg);color:var(--ok)}
.wdet{padding:0 2px 14px;display:flex;flex-direction:column;gap:8px}
.wdet .ex{font-size:14.5px;max-width:none}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:30px 0}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.time-rec{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.time-rec .label{margin:0}.time-rec .mid{margin:0}.time-rec .mid small{font-size:13px}
.bests{padding:6px 16px}
.best-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.best-row:last-child{border-bottom:0}
.best-row span{font-weight:700;font-size:14px}.best-row b{font-family:var(--f-word);font-variant-numeric:tabular-nums}
.best-row b small,.best-row>small{color:var(--muted);font-size:11.5px;font-weight:700}
.soon-wait{margin:0;text-align:right;font-weight:700;color:var(--primary);line-height:1.3}
.soon-wait small{color:var(--muted);font-weight:700}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-variant-numeric:tabular-nums}
.seg button.on{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.checks{display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.checks input{width:20px;height:20px;accent-color:var(--primary)}
.panel{padding:16px;display:flex;flex-direction:column;gap:10px}
.warn{background:var(--ng-bg);color:var(--ng);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--primary)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100% - 48px);text-align:center}
.streak .star{color:var(--gold);font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:11.5px;color:var(--muted);font-weight:700}
.stat b{font-family:var(--f-word);font-size:22px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat b small{font-family:var(--f-ja);font-size:11.5px;color:var(--muted);margin:0 2px}
.rank{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--tint);border-radius:var(--r)}
.rank-badge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:var(--white);font-family:var(--f-word);font-weight:800;font-size:14px;box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--rc)}
.rank-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rank-title{font-weight:900;font-size:17px;line-height:1.3}
.rank-next{font-size:12px;color:var(--muted)}
.rank .bar{background:var(--white)}
.mrow{display:flex;flex-direction:column;gap:6px}
.mlabel{font-size:12px;color:var(--muted);font-weight:700}
.medals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 6px}
.medal{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.medal i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-word);font-weight:800;font-size:15px;background:var(--mc);color:var(--white);box-shadow:inset 0 0 0 3px rgba(255,255,255,.4),0 0 0 2px var(--mc)}
.medal.off i{background:var(--locked);color:var(--muted);box-shadow:none}
.medal span{font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.3}
.medal.off span{opacity:.7}
.tier{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tier-stars{font-size:34px;letter-spacing:4px;color:var(--gold);line-height:1}
.tier-stars .off{color:var(--locked)}
.tier-msg{font-size:22px;font-weight:900;text-wrap:balance;line-height:1.4}
.tier.t4 .tier-msg{color:var(--primary)}
.tier-sub{color:var(--muted);font-size:14px}
.rankup{background:var(--hl);color:var(--hl-ink);border-radius:10px;padding:10px 12px;font-weight:900;text-align:center}
.newmedals{background:var(--tint);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.combo{display:inline-block;margin-left:8px;background:var(--hl);color:var(--hl-ink);font-weight:900;border-radius:999px;padding:2px 12px;font-size:13px;vertical-align:middle}
.pop{animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" id="tabs" aria-label="メニュー">
  <button data-act="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>

  <button data-act="tab" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>一覧</button>
  <button data-act="tab" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
</nav>

const MORE={streak:{list:[150,200,300,365,500,730,1000],step:500},correct:{list:[5000,10000,20000,30000,50000],step:25000},
  time:{list:[3000,6000,12000,18000,30000],step:12000},perfect:{list:[150,200,300,500],step:250},words:{list:[1500,2000,3000,4000,5000],step:1000}};

const kfmt=n=>n>=1000?(n%1000?(n/1000).toFixed(1):n/1000)+"K":String(n);
function mkMedal(cat,n,i){
  const h=Math.round(n/60);
  const inner=cat==="time"?h+"h":cat==="correct"||cat==="words"?kfmt(n):String(n);
  const label=cat==="streak"?n+"日連続":cat==="correct"?"正解"+n+"語":cat==="time"?h+"時間":cat==="perfect"?"満点"+n+"回":n+"語";
  return{id:PFX[cat]+n,cat,n,t:["g","p","m"][i%3],inner,label};
}
function medalsFor(cat,upTo){ // 取れたメダルぜんぶ＋次の1個
  const out=MEDALS.filter(m=>m.cat===cat);if(out[out.length-1].n>upTo)return out;
  const mo=MORE[cat],nth=i=>i<mo.list.length?mo.list[i]:mo.list[mo.list.length-1]+mo.step*(i-mo.list.length+1);
  for(let i=0;;i++){const m=mkMedal(cat,nth(i),i);out.push(m);if(m.n>upTo)return out;}
}
function medalValues(){return{streak:Math.max(streak(),S.stats.bestStreak||0),correct:S.stats.correct,time:Math.floor(S.stats.timeMs/60000),perfect:S.stats.perfect,words:S.words.filter(w=>w.stage>0).length};}

  const v=medalValues();S.stats.bestStreak=v.streak;
  return Object.keys(CATS).flatMap(c=>medalsFor(c,v[c])).filter(m=>!S.stats.medals[m.id]&&v[m.cat]>=m.n).map(m=>{S.stats.medals[m.id]=today();return m;});

function medalHTML(m,pop){const on=!!S.stats.medals[m.id];return`<div class="medal ${on?"":"off"} ${pop?"pop":""}"><i style="--mc:var(--${TC[m.t]})">${m.inner}</i><span>${m.label}</span></div>`;}

function cloze(w){
  if(!w.ex||/\s/.test(w.w))return null;
  const stem=w.w.length>4?w.w.slice(0,-1):w.w;
  const re=new RegExp("(^|[^A-Za-z])("+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[A-Za-z]*)","i");
  const m=re.exec(w.ex);if(!m)return null;
  const s=m.index+m[1].length;
  return{before:w.ex.slice(0,s),hit:m[2],after:w.ex.slice(s+m[2].length)};
}
// 発音記号（CMU発音辞書をもとにしたアメリカ式）。ipa.json は後から読みこむ
let IPA=null;
function ipaOf(w){
  if(w.ipa)return w.ipa;if(!IPA)return"";
  const ps=String(w.w).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z' \-]/g,"").split(/[\s\-]+/).filter(Boolean);
  const r=ps.map(x=>IPA[x]||IPA[x.replace(/'s$/,"")]||"");
  return r.length&&r.every(Boolean)?r.join(" "):"";
}
const ipaHTML=w=>{const p=ipaOf(w);return p?`<p class="ipa">/${esc(p)}/</p>`:"";};
function hlEx(w){const c=cloze(w);return c?esc(c.before)+"<mark>"+esc(c.hit)+"</mark>"+esc(c.after):esc(w.ex);}

  const all=soonAll();if(!all.length)return"";
  const ready=soonReady().length;
  if(ready)return`<div class="hero-row sub soon"><div><p class="label">おさらい（さっきの単語をもう一度）</p><p class="mid">${ready}<small>語</small></p></div>
      <button class="btn primary" data-act="start-soon">おさらいする</button></div>`;
  const next=Math.min(...all.map(w=>w.soon)),min=Math.max(1,Math.ceil((next-Date.now())/60000));
  return`<div class="hero-row sub soon"><div><p class="label">おさらい（さっきの単語をもう一度）</p><p class="mid">${all.length}<small>語</small></p></div>
      <p class="soon-wait">${hm(next)}から<br><small>あと${min>=60?Math.floor(min/60)+"時間"+(min%60?min%60+"分":""):min+"分"}</small></p></div>`;
}

/* ---------- quiz ---------- */
function startSession(mode,set){
  let items=[];
  if(mode==="review")items=shuffle(dueList()).map(w=>({id:w.id,phase:"quiz"}));
  else if(mode==="soon")items=shuffle(soonReady()).map(w=>({id:w.id,phase:"quiz"}));
  else if(mode==="new"){const ws=newList().slice(0,newLeft());for(let i=0;i<ws.length;i+=5){const ch=ws.slice(i,i+5);ch.forEach(w=>items.push({id:w.id,phase:"intro"}));shuffle(ch).forEach(w=>items.push({id:w.id,phase:"quiz"}));}}
  else items=shuffle(S.words.filter(w=>w.set===set)).map(w=>({id:w.id,phase:"quiz"}));
  if(!items.length)return;
  Q={mode,set,items,i:0,res:{},requeued:{},n:0,c:0,done:false,combo:0,bestCombo:0,lastT:Date.now(),newMedals:[]};
  prepare();render();window.scrollTo(0,0);speakCurrent();
}
function prepare(){
  const it=Q.items[Q.i];if(!it){finish();return;}
  const w=byId(it.id);if(!w){Q.i++;return prepare();}
  Q.answered=false;Q.pick=null;Q.typed="";
  Q.cur=it.phase==="intro"?{type:"intro",w}:buildQ(chooseType(w),w);
}
function chooseType(w){
  const t=S.settings.types;let el=[];
  if(t.en2ja)el.push("en2ja");if(t.ja2en)el.push("ja2en");
  if(t.cloze&&cloze(w))el.push("cloze");if(t.listen&&hasSpeech)el.push("listen");
  if(t.spell&&(w.stage>=2||Q.mode==="free")&&Q.mode!=="new"&&/^[A-Za-z'-]+$/.test(w.w))el.push("spell");
  if(!el.length)el=["en2ja"];
  return el[Math.floor(Math.random()*el.length)];
}
function distract(w,key,n=3){
  const pool=shuffle(S.words.filter(x=>x.id!==w.id&&x.set===w.set)).concat(shuffle(S.words.filter(x=>x.id!==w.id&&x.set!==w.set)));
  const out=[],seen=new Set([norm(w[key])]);
  for(const x of pool){const k=norm(x[key]);if(!k||seen.has(k))continue;seen.add(k);out.push(x);if(out.length>=n)break;}
  return out;
}
function buildQ(type,w){
  if(type==="spell")return{type,w};
  const key=(type==="ja2en"||type==="cloze")?"w":"ja";
  const q={type,w,key,opts:shuffle([w,...distract(w,key)]).map(x=>({id:x.id,text:x[key]}))};
  if(type==="cloze")q.cz=cloze(w);
  return q;
}
function speakCurrent(){if(!Q||Q.done||!Q.cur)return;if(Q.cur.type==="listen"||Q.cur.type==="intro")speak(Q.cur.w.w);}
function settle(ok){
  Q.answered=true;Q.ok=ok;const id=Q.cur.w.id;tick();
  if(ok){S.stats.correct++;Q.combo++;Q.bestCombo=Math.max(Q.bestCombo,Q.combo);S.stats.bestCombo=Math.max(S.stats.bestCombo,Q.combo);}else Q.combo=0;
  const r=Q.res[id]||(Q.res[id]={wrong:false});
  r.last=ok; // 最後に答えたときに正解したか
  if(!ok){r.wrong=true;Q.requeued[id]=(Q.requeued[id]||0)+1;if(Q.requeued[id]<=10)Q.items.push({id,phase:"quiz"});}
  Q.n++;if(ok)Q.c++;
  const d=S.days[today()]||(S.days[today()]={n:0,c:0});d.n++;if(ok)d.c++;
  save();render();speak(Q.cur.w.w);
}
function next(){tick();Q.i++;prepare();render();window.scrollTo(0,0);speakCurrent();}
function applySRS(){
  if(!Q||Q.mode==="free"||Q.applied)return;Q.applied=true;const t=today();
  const gap=(S.settings.soonMin||0)*60000,later=Date.now()+gap;
  if(Q.mode==="soon"){
    Object.entries(Q.res).forEach(([id,r])=>{const w=byId(id);if(!w)return;
      if(r.wrong){w.ng++;w.soon=gap?later:null;}else{w.ok++;delete w.soon;}});
    save();return;
  }
  Object.entries(Q.res).forEach(([id,r])=>{const w=byId(id);if(!w)return;
    const firstTime=w.stage===0;delete w.soon;
    if(gap&&(r.wrong||firstTime))w.soon=later;
    if(r.wrong){w.ng++;if(!w.learned)w.learned=t;w.stage=1;w.due=addDays(t,1);}
    else{w.ok++;const prev=w.stage;if(prev===0){w.stage=1;w.learned=t;}else w.stage=Math.min(prev+1,6);w.due=addDays(t,prev===6?90:DAYS[w.stage]);}
  });
  save();
}
function finish(){
  if(Q.done)return;applySRS();tick();
  const ids=Object.keys(Q.res);Q.total=ids.length;Q.first=ids.filter(id=>!Q.res[id].wrong).length;
  Q.rate=Q.total?Q.first/Q.total:0;Q.tier=tierOf(Q.rate);Q.stars=Q.total?Q.tier+1:0;Q.starsBefore=S.stats.stars;
  if(Q.total){S.stats.sessions++;S.stats.stars+=Q.stars;if(Q.tier===4)S.stats.perfect++;}
  recordTime();
  Q.newMedals=checkMedals();save();Q.done=true;
}

/* ---------- 全問正解までの時間と自己ベスト ---------- */
// 新しい単語は語数ごと、セット練習はセットごと、復習・おさらいは1語あたりの時間で比べる
const MODE_JA={new:"新しい単語",review:"今日の復習",soon:"おさらい",free:"セット練習"};
const fmtSec=sec=>sec<60?`${sec}秒`:`${Math.floor(sec/60)}分${sec%60?`${sec%60}秒`:""}`;
function recKey(){return Q.mode==="new"?`new:${Q.total}`:Q.mode==="free"?`set:${Q.set}`:Q.mode;}
function recName(k){const[m,x]=k.split(/:(.*)/);return m==="new"?`新しい単語 ${x}語`:m==="set"?`セット ${x}`:MODE_JA[m]||m;}
function recordTime(){
  Q.allOk=Q.total>0&&Object.values(Q.res).every(r=>r.last);
  Q.sec=Math.max(1,Math.round((Q.act||0)/1000));
  if(!Q.allOk)return;
  S.stats.best=S.stats.best||{};
  const k=recKey(),perWord=Q.mode==="review"||Q.mode==="soon";
  const score=perWord?Q.sec/Q.total:Q.sec,old=S.stats.best[k];
  const oldScore=old?(perWord?old.sec/old.n:old.sec):Infinity;
  Q.prevBest=old||null;
  if(score<oldScore){S.stats.best[k]={sec:Q.sec,n:Q.total,date:today()};Q.newBest=true;}
}
function timeHTML(){
  if(!Q.total)return"";
  const perWord=Q.mode==="review"||Q.mode==="soon",k=recKey(),b=(S.stats.best||{})[k];
  if(!Q.allOk)return`<p class="note">かかった時間 ${fmtSec(Q.sec)}（全問正解まで行かなかったので、記録には入りません）</p>`;
  return`<div class="time-rec${Q.newBest?" best":""}"><p class="label">全問正解までの時間</p><p class="mid">${fmtSec(Q.sec)}${perWord?`<small>（1語 ${(Q.sec/Q.total).toFixed(1)}秒）</small>`:""}</p>
    ${Q.newBest?`<p class="rankup pop">自己ベスト更新！${Q.prevBest?`（前は ${fmtSec(Q.prevBest.sec)}${perWord?`・1語 ${(Q.prevBest.sec/Q.prevBest.n).toFixed(1)}秒`:""}）`:""}</p>`
      :`<p class="note">自己ベスト ${fmtSec(b.sec)}${perWord?`（1語 ${(b.sec/b.n).toFixed(1)}秒）`:""}・${recName(k)}</p>`}</div>`;
}
function bestsHTML(){
  const bs=Object.entries((S.stats&&S.stats.best)||{});if(!bs.length)return"";
  const order=k=>k.startsWith("new:")?Number(k.slice(4)):k.startsWith("set:")?1e6:k==="review"?-2:-1;
  bs.sort((a,b)=>order(a[0])-order(b[0])||a[0].localeCompare(b[0]));
  return`<section><h2>自己ベスト <span class="note">全問正解までの時間</span></h2><div class="card bests">${bs.map(([k,b])=>{const pw=k==="review"||k==="soon";
    return`<div class="best-row"><span>${esc(recName(k))}</span><b>${fmtSec(b.sec)}${pw?`<small> 1語${(b.sec/b.n).toFixed(1)}秒</small>`:""}</b><small>${md(b.date)}</small></div>`;}).join("")}</div></section>`;
}

const NOISE=["back to course","words to remember","list of words","review the words","continue","learned","free mode","practice","tap the +","must finish","my words","when you are ready"];
function parseText(txt){
  const m=txt.match(/\(\s*([A-Za-z]\s*\d+)\s*\)/);const set=m?m[1].replace(/\s/g,"").toUpperCase():"";
  const isJa=s=>/[぀-ヿ㐀-鿿]/.test(s);
  const isWord=s=>/^[A-Za-z][A-Za-z'\-]*( [A-Za-z'\-]+){0,2}$/.test(s)&&s.length<=30;
  const lines=txt.split(/\r?\n/).map(s=>s.replace(/[​ \s]+/g," ").trim()).filter(Boolean);
  const out=[];let cur=null;
  const push=()=>{if(cur&&cur.ja)out.push({w:cur.w,ja:cur.ja,ex:cur.ex.trim()});};
  for(const line of lines){
    const low=line.toLowerCase();
    if(NOISE.some(n=>low.includes(n))||/^\d+\s*\/\s*\d+$/.test(line)||/^start$/i.test(line))continue;
    if(!cur||!cur.ja){
      if(isWord(line)&&!isJa(line)){cur={w:line,ja:"",ex:""};continue;}
      if(cur&&isJa(line)){cur.ja=line;continue;}
      continue;
    }
    if(isJa(line)&&!cur.ex){cur.ja+=" "+line;continue;}
    if(isWord(line)&&(!cur.ex||/[.?!"”]$/.test(cur.ex))&&/^[a-z]/.test(line)){push();cur={w:line,ja:"",ex:""};continue;}
    if(!isJa(line))cur.ex+=(cur.ex?" ":"")+line;
  }
  push();
  return{set,items:out};
}

function upsert(set,w,ja,ex,more){
  const add=x=>{if(more&&more.ipa)x.ipa=more.ipa;if(more&&more.note)x.note=more.note;return x;};
  const ex0=S.words.find(x=>norm(x.w)===norm(w));
  if(ex0){ex0.ja=ja;ex0.ex=ex;add(ex0);return false;}
  S.words.push(add({id:uid(),set,w,ja,ex,stage:0,due:null,ok:0,ng:0,learned:null}));return true;
}

/* ---------- photo reading ---------- */
const TESS_URL="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let ocrBusy=false,ocrMsg="",ocrErr=false,dict=null;const ocrWorkers={};
function ocrStatusHTML(){return ocrMsg?`<p class="ocr-st${ocrErr?" err":""}">${ocrBusy?'<span class="spin" aria-hidden="true"></span>':""}${esc(ocrMsg)}</p>`:"";}
function setOcr(msg,err){ocrMsg=msg;ocrErr=!!err;const el=document.getElementById("ocr-status");if(el)el.innerHTML=ocrStatusHTML();
  document.querySelectorAll("[data-ocr]").forEach(i=>{i.disabled=ocrBusy;i.parentElement.classList.toggle("off",ocrBusy);});}
function loadScript(src){return new Promise((ok,ng)=>{if(window.Tesseract)return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ng(new Error("script"));document.head.appendChild(s);});}
let ocrStep="";
async function getWorker(langs){
  const key=langs.join("+");if(ocrWorkers[key])return ocrWorkers[key];
  await loadScript(TESS_URL);
  ocrWorkers[key]=Tesseract.createWorker(langs,1,{logger:m=>{
    if(!ocrBusy)return;const p=m.progress?` ${Math.round(m.progress*100)}%`:"";
    if(m.status==="recognizing text")setOcr(`${ocrStep}読み取り中…${p}`);
    else if(/load|initializ/.test(m.status))setOcr(`読み取りの準備中…${p}（初回は少し時間がかかります）`);
  }}).catch(e=>{delete ocrWorkers[key];throw e;});
  return ocrWorkers[key];
}
function loadImg(file){return new Promise((ok,ng)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{ok(im);setTimeout(()=>URL.revokeObjectURL(u),1000);};im.onerror=()=>ng(new Error("image"));im.src=u;});}
const isRed=(r,g,b)=>r>120&&r-g>55&&r-b>35;
async function prepImage(file){
  const im=await loadImg(file);
  const k=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight));
  const W=Math.round(im.naturalWidth*k),H=Math.round(im.naturalHeight*k);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const cx=cv.getContext("2d",{willReadFrequently:true});
  cx.drawImage(im,0,0,W,H);const id=cx.getImageData(0,0,W,H),d=id.data,mask=new Uint8Array(W*H);
  for(let i=0,p=0;i<d.length;i+=4,p++){const r=d[i],g=d[i+1],b=d[i+2];
    if(isRed(r,g,b)){mask[p]=1;d[i]=d[i+1]=d[i+2]=255;}
    else{const y=Math.round(.299*r+.587*g+.114*b);d[i]=d[i+1]=d[i+2]=y;}}
  cx.putImageData(id,0,0);return{cv,mask,W,H};
}
function redRatio(img,x0,x1,y0,y1){
  x0=Math.max(0,Math.floor(x0));x1=Math.min(img.W-1,Math.ceil(x1));y0=Math.max(0,Math.floor(y0));y1=Math.min(img.H-1,Math.ceil(y1));
  if(x1<=x0||y1<=y0)return 0;let hit=0;
  for(let x=x0;x<=x1;x++){for(let y=y0;y<=y1;y++){if(img.mask[y*img.W+x]){hit++;break;}}}
  return hit/(x1-x0+1);
}
function underlined(img,b){const h=b.y1-b.y0;return redRatio(img,b.x0,b.x1,b.y0+h*.5,b.y1+Math.max(6,h*.8))>=.55;}
function cleanJa(t){const J="[぀-ヿ㐀-鿿、。・ー「」（）()〜]";
  return t.replace(new RegExp(`(${J}) +(?=${J})`,"g"),"$1").replace(/[|｜]/g,"");}
async function loadDict(){
  if(dict)return dict;setOcr("辞書を準備中…");
  const r=await fetch("dict.json");if(!r.ok)throw new Error("dict");dict=await r.json();return dict;
}
function lemma(w){
  const D=dict.w,c=[w];if(dict.irr[w])c.push(dict.irr[w]);
  const cut=n=>w.slice(0,-n),dbl=s=>s.length>2&&s[s.length-1]===s[s.length-2]?s.slice(0,-1):null;
  if(w.endsWith("ies"))c.push(cut(3)+"y");if(w.endsWith("es"))c.push(cut(2));if(w.endsWith("s"))c.push(cut(1));
  if(w.endsWith("ied"))c.push(cut(3)+"y");if(w.endsWith("ed")){c.push(cut(2),cut(1),dbl(cut(2)));}
  if(w.endsWith("ing")){c.push(cut(3),cut(3)+"e",dbl(cut(3)));}
  if(w.endsWith("ier"))c.push(cut(3)+"y");if(w.endsWith("iest"))c.push(cut(4)+"y");
  if(w.endsWith("er"))c.push(cut(2),cut(1));if(w.endsWith("est"))c.push(cut(3),cut(2));
  if(w.endsWith("ly"))c.push(cut(2));if(w.endsWith("ily"))c.push(cut(3)+"y");
  for(const x of c)if(x&&D[x])return{w:x,ja:D[x]};return{w,ja:""};
}
function sentenceFor(text,surface){
  const flat=text.replace(/-\s*\n\s*/g,"").replace(/\s+/g," ").trim();
  const ss=flat.split(/(?<=[.!?”"])\s+(?=[A-Z“"])/);
  const re=new RegExp("(^|[^A-Za-z])"+surface.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[^A-Za-z])","i");
  let s=ss.find(x=>re.test(x))||"";
  if(s.length>180){const i=s.search(re);const a=Math.max(0,i-80);s=(a?"…":"")+s.slice(a,a+170).trim()+"…";}
  return s;
}
function redItems(img,data){
  const words=(data.words||[]).filter(w=>/[A-Za-z]/.test(w.text));
  const out=[];let prev=null;
  for(const w of words){
    const t=w.text.replace(/^[^A-Za-z]+|[^A-Za-z'\-]+$/g,"");
    if(!t||!underlined(img,w.bbox)){prev=null;continue;}
    const sameLine=prev&&prev.line===w.line;
    const gapRed=sameLine&&redRatio(img,prev.bbox.x1,w.bbox.x0,Math.min(prev.bbox.y1,w.bbox.y1)-2,Math.max(prev.bbox.y1,w.bbox.y1)+Math.max(6,(w.bbox.y1-w.bbox.y0)*.8))>=.6;
    if(gapRed&&out.length){const o=out[out.length-1];o.surface+=" "+t;o.parts.push(t);}
    else out.push({surface:t,parts:[t]});
    prev=w;
  }
  return out;
}
async function runOCR(files,mode){
  if(ocrBusy||!files.length)return;
  ocrBusy=true;setOcr("写真を読みこみ中…");
  try{
    if(mode==="red")await loadDict();
    const worker=await getWorker(mode==="red"?["eng"]:["eng","jpn"]);
    const items=[];let texts=[];const seen=new Set(S.words.map(w=>norm(w.w)));const got=new Set();
    for(let i=0;i<files.length;i++){
      ocrStep=files.length>1?`${i+1}/${files.length}枚目を`:"";setOcr(`${ocrStep}読み取り中…`);
      const img=await prepImage(files[i]);
      const {data}=await worker.recognize(img.cv);
      if(mode==="red"){
        for(const it of redItems(img,data)){
          const lw=it.surface.toLowerCase();
          let w,ja;
          if(it.parts.length>1){const hd=lemma(it.parts[0].toLowerCase());w=[hd.w].concat(it.parts.slice(1).map(s=>s.toLowerCase())).join(" ");ja=dict.w[w]||dict.w[lw]||"";}
          else{const r=lemma(lw);w=r.w;ja=r.ja;}
          if(got.has(w))continue;got.add(w);
          items.push({w,ja,ex:sentenceFor(data.text,it.surface)});
        }
      }else texts.push(cleanJa(data.text));
    }
    ocrBusy=false;
    if(mode==="red"){
      const sn=(document.getElementById("setname")||{}).value||"";
      preview={set:sn.trim()||"赤線",items,red:true};ocrMsg="";render();
      if(!items.length)setOcr("赤線の単語が見つかりませんでした。赤ペンの線がはっきり写るように、明るい場所で真上から撮ってください。",true);
      else{const miss=items.filter(x=>!x.ja).length;setOcr(`${items.length}語見つかりました${miss?`（${miss}語は意味を入れてください）`:""}`);}
    }else{
      draft=(draft?draft+"\n":"")+texts.join("\n");
      const p=parseText(draft);const sn=(document.getElementById("setname")||{}).value||"";
      preview={set:sn.trim()||p.set,items:p.items};ocrMsg="";render();
      if(!p.items.length)setOcr("単語をうまく分けられませんでした。下の「読み取った文字」を確認するか、明るい場所で撮り直してください。",true);
      else setOcr(`${p.items.length}語を読み取りました`);
    }
    const el=document.getElementById("preview");if(el&&preview.items.length)el.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(err){
    ocrBusy=false;console.error(err);
    setOcr(err&&err.message==="dict"?"辞書を読みこめませんでした。電波のよい場所でもう一度ためしてください。":err&&err.message==="image"?"写真を開けませんでした。別の写真でためしてください。":"読み取りに失敗しました。電波のよい場所でもう一度ためしてください。",true);
  }
}

/* ---------- Claudeのアプリで読み取る ---------- */
// 写真をClaudeのアプリに送って読み取ってもらい、返事の最後のまとめ（JSON）を貼りつけて取りこむ。追加料金なし。
let aiMode="red",aiFallback=false;
const AI_PROMPT={
red:`These are photos of pages from an English text. The reader underlines words and phrases they don't know (usually with a red pen).

1. Find EVERY underlined word or phrase. Check every line of every photo carefully: lines can be faint, slanted, short, or run across a line break. Only underlined ones. If nothing is underlined, return an empty "words" list.
2. For each one, fill in:
   - word: the dictionary form (lemma). Keep multi-word phrases as phrases.
   - surface: the form as written on the page.
   - reading: IPA pronunciation of the dictionary form (American), without slashes.
   - pos: part of speech in Japanese (名詞, 動詞, 形容詞, 副詞, 句動詞, 熟語 etc.).
   - meaning_ja: a short Japanese meaning that fits this context, like a vocabulary book (about 20 characters or less).
   - meaning_en: a short, simple English definition.
   - sentence: the full sentence from the page that contains it, copied exactly.
   - note: one short Japanese line on nuance, common collocations, or a confusable word. Empty string if nothing useful.
3. "set": leave as an empty string.`,
list:`These are photos of an English vocabulary list (word book or app screen).

1. Include EVERY English word or phrase in the list, in the order shown. Do not skip any.
2. For each one, fill in:
   - word: as printed.
   - surface: same as word.
   - reading: IPA pronunciation (American), without slashes.
   - pos: part of speech in Japanese (名詞, 動詞, 形容詞, 副詞, 熟語 etc.).
   - meaning_ja: the Japanese meaning printed in the list. If none is printed, a short common Japanese meaning.
   - meaning_en: a short, simple English definition.
   - sentence: the example sentence printed with it. If none is printed, write one short natural example sentence.
   - note: empty string.
3. "set": the set or unit name if one is shown (for example "C12"), otherwise an empty string.`};
const AI_FORMAT=`

At the end, output ONLY this JSON in a single \`\`\`json code block so I can import it into my vocabulary app (C単語ドリル). Do not rename the keys.
{"set":"","words":[{"word":"","surface":"","reading":"","pos":"","meaning_ja":"","meaning_en":"","sentence":"","note":""}],"questions":[]}`;
const aiPrompt=m=>AI_PROMPT[m]+AI_FORMAT;
function parseAiReply(text){
  const block=text.match(/```(?:json)?\s*([\s\S]*?)```/);const body=block?block[1]:text;
  const a=body.indexOf("{"),b=body.lastIndexOf("}");if(a<0||b<=a)throw new Error("nojson");
  const d=JSON.parse(body.slice(a,b+1)),str=v=>v==null?"":String(v).trim();
  const items=(Array.isArray(d.words)?d.words:[]).filter(w=>w&&(w.word||w.surface)).map(w=>({
    w:str(w.word||w.surface),ja:str(w.meaning_ja||w.meaning),ex:str(w.sentence),
    ipa:str(w.reading).replace(/^\/+|\/+$/g,"").replace(/^\[|\]$/g,""),pos:str(w.pos),note:str(w.note)}));
  const seen=new Set();return{set:str(d.set),items:items.filter(it=>{const k=norm(it.w);if(seen.has(k))return false;seen.add(k);return true;})};
}
function aiTake(text){
  let r;try{r=parseAiReply(text);}catch(e){toast("まとめの部分が見つかりませんでした。返事の最後のコード欄をコピーしてください");return;}
  if(!r.items.length){toast("取りこめる単語が見つかりませんでした");return;}
  const sn=((document.getElementById("setname")||{}).value||"").trim();
  preview={set:sn||r.set||(aiMode==="red"?"赤線":""),items:r.items,ai:true};aiFallback=false;ocrMsg="";render();
  const el=document.getElementById("preview");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
  toast(`${r.items.length}語を読みこみました`);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="tab"){view=b.dataset.v;confirmDel=null;confirmRestore=false;render();window.scrollTo(0,0);return;}
  if(a==="start-review")return startSession("review");
  if(a==="start-new")return startSession("new");
  if(a==="start-soon")return startSession("soon");
  if(a==="free")return startSession("free",b.dataset.set);
  if(a==="say")return speak(b.dataset.t);
  if(a==="pick"){if(Q.answered)return;Q.pick=b.dataset.id;return settle(Q.pick===Q.cur.w.id);}
  if(a==="check"){const v=document.getElementById("spell").value;Q.typed=v;return settle(norm(v)===norm(Q.cur.w.w));}
  if(a==="next")return next();
  if(a==="quit"){tick();applySRS();checkMedals();save();Q=null;view="home";render();if(true)toast("ここまでの結果を保存しました");return;}
  if(a==="home"){Q=null;view="home";render();window.scrollTo(0,0);return;}
  if(a==="parse"){
    draft=document.getElementById("paste").value;
    const p=parseText(draft);const sn=document.getElementById("setname").value.trim();
    preview={set:sn||p.set,items:p.items};render();
    const el=document.getElementById("preview");if(el&&preview.items.length)el.scrollIntoView({behavior:"smooth",block:"start"});return;
  }
  if(a==="aimode"){aiMode=b.dataset.m;render();return;}
  if(a==="ai-copy"){const t=aiPrompt(aiMode);
    const fb=()=>{aiFallback=true;render();const ta=document.getElementById("ai-text");ta.value=t;ta.focus();ta.select();toast("自動でコピーできませんでした。下の文章を長押ししてコピーしてください");};
    try{navigator.clipboard.writeText(t).then(()=>toast("コピーしました。Claudeのアプリに貼りつけてください"),fb);}catch(e){fb();}return;}
  if(a==="ai-paste"){
    const fb=()=>{aiFallback=true;render();document.getElementById("ai-text").focus();toast("下の欄に長押しで貼りつけて、「この内容で取りこむ」を押してください");};
    try{navigator.clipboard.readText().then(t=>t&&t.trim()?aiTake(t):toast("コピーされた内容がありません"),fb);}catch(e){fb();}return;}
  if(a==="ai-take"){aiTake(document.getElementById("ai-text").value);return;}
  if(a==="commit"){
    const set=(document.getElementById("setname").value.trim()||preview.set||"追加").toUpperCase();
    let added=0,upd=0,skip=0;
    preview.items.forEach((_,i)=>{if(!document.getElementById("pv-c"+i).checked)return;
      const w=document.getElementById("pv-w"+i).value.trim(),ja=document.getElementById("pv-j"+i).value.trim(),ex=document.getElementById("pv-e"+i).value.trim();
      if(!w||!ja){skip++;return;}const it=preview.items[i],same=norm(it.w)===norm(w);
      upsert(set,w,ja,ex,same?{ipa:it.ipa,note:it.note}:null)?added++:upd++;});
    save();preview=null;draft="";ocrMsg="";render();toast(`${set} に${added}語を追加${upd?`・${upd}語を更新`:""}しました${skip?`（意味が空の${skip}語はとばしました）`:""}`);return;
  }
  if(a==="add-one"){
    const w=document.getElementById("m-w").value.trim(),ja=document.getElementById("m-j").value.trim(),ex=document.getElementById("m-e").value.trim(),set=(document.getElementById("m-s").value.trim()||"追加").toUpperCase();
    if(!w||!ja){toast("英単語と意味を入れてください");return;}
    const isNew=upsert(set,w,ja,ex);save();render();toast(isNew?`${w} を追加しました`:`${w} を更新しました`);return;
  }
  if(a==="toggle"){openId=openId===b.dataset.id?null:b.dataset.id;confirmDel=null;document.getElementById("rows").innerHTML=rowsHTML();return;}
  if(a==="del"){const id=b.dataset.id;if(confirmDel!==id){confirmDel=id;document.getElementById("rows").innerHTML=rowsHTML();return;}
    const w=byId(id);S.words=S.words.filter(x=>x.id!==id);confirmDel=null;openId=null;save();render();toast(`${w?w.w:""} を削除しました`);return;}
  if(a==="soonmin"){S.settings.soonMin=Number(b.dataset.n);if(!S.settings.soonMin)S.words.forEach(w=>delete w.soon);save();render();return;}
  if(a==="perday"){S.settings.perDay=Number(b.dataset.n);save();render();return;}
  if(a==="mk-backup"){try{backup=btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(err){backup="";toast("コードを作れませんでした");}render();return;}
  if(a==="copy-backup"){const ta=document.getElementById("bk-out");
    const sel=()=>{ta.focus();ta.select();toast("選択しました。長押しでコピーしてください");};
    try{navigator.clipboard.writeText(backup).then(()=>toast("コピーしました"),sel);}catch(err){sel();}return;}
  if(a==="restore"){const raw=document.getElementById("bk-in").value.replace(/\s+/g,"");
    if(!raw){toast("コードを貼りつけてください");return;}
    let o;try{o=JSON.parse(decodeURIComponent(escape(atob(raw))));}catch(err){toast("コードが読み取れません。全部コピーできているか確認してください");return;}
    if(!o||!Array.isArray(o.words)){toast("コードが読み取れません");return;}
    if(!confirmRestore){confirmRestore=true;const keep=raw;render();document.getElementById("bk-in").value=keep;return;}
    S=o;normalize();
    confirmRestore=false;save();render();toast(`${S.words.length}語の記録を戻しました`);return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.ocr){const fs=[...t.files];t.value="";runOCR(fs,t.dataset.ocr);return;}
  if(t.dataset&&t.dataset.type){
    S.settings.types[t.dataset.type]=t.checked;
    if(!Object.values(S.settings.types).some(Boolean)){S.settings.types[t.dataset.type]=true;t.checked=true;toast("1つ以上は選んでください");}
    save();return;
  }
  if(t.id==="fset"){listSet=t.value;openId=null;document.getElementById("rows").innerHTML=rowsHTML();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){listQ=e.target.value;document.getElementById("rows").innerHTML=rowsHTML();}
  if(e.target.id==="paste")draft=e.target.value;
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="spell"&&Q&&!Q.answered){e.preventDefault();const v=e.target.value;Q.typed=v;settle(norm(v)===norm(Q.cur.w.w));}
});
setInterval(()=>{if(view==="home"&&!Q&&soonAll().length)render();},30000);
// 成長ログが単語を足していることがあるので、開き直したときは保存データを読み直す
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!Q){if(!preview)load();render();}});

load();save();render();
fetch("ipa.json").then(r=>r.ok?r.json():null).then(o=>{if(!o)return;IPA=o;
  if(view==="add"&&!Q)return; // 入力中の欄を消さない
  if(Q&&!Q.answered&&Q.cur&&Q.cur.type==="spell")return;
  render();}).catch(()=>{});
</script>
